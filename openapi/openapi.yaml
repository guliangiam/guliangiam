  /.well-known/{application}/jwks.json:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetJWKSByApplication
      summary: JSON Web Key Set (per application)
      x-permission: public
      parameters:
        - name: application
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JSON Web Key Set (per application)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/{application}/oauth-protected-resource:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetOAuthProtectedResourceByApplication
      summary: OAuth 2.0 Protected Resource Metadata (per application, RFC 9728)
      x-permission: public
      parameters:
        - name: application
          in: path
          required: true
          schema:
