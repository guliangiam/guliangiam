      tags:
        - "management: adapters"
      operationId: ListAdapters
      summary: List Casbin adapters
      x-permission: adapters:read
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: databaseType
          in: query
          required: false
          schema:
            type: string
        - name: fieldIndex
          in: query
          required: false
          schema:
            type: string
        - name: fieldValue
          in: query
          required: false
          schema:
            type: string
        - name: isEnabled
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List Casbin adapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/adapters/{id}:
    delete:
      tags:
        - "management: adapters"
      operationId: DeleteAdapter
      summary: Delete Casbin adapter
      x-permission: adapters:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delete Casbin adapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags:
        - "management: adapters"
      operationId: GetAdapter
      summary: Get Casbin adapter detail
      x-permission: adapters:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Get Casbin adapter detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - "management: adapters"
      operationId: PatchAdapter
      summary: Patch Casbin adapter
      x-permission: adapters:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAdapterRequest'
      responses:
        '200':
          description: Patch Casbin adapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/adapters/{id}/policies:
    post:
      tags:
        - "management: adapters"
      operationId: AddAdapterPolicy
      summary: Add policy to adapter
      x-permission: adapters:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAdapterPolicyRequest'
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags:
        - "management: adapters"
      operationId: GetAdapterPolicies
      summary: Get policies from adapter
      x-permission: adapters:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Get policies from adapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - "management: adapters"
      operationId: RemoveAdapterPolicy
      summary: Remove policy from adapter
      x-permission: adapters:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Remove policy from adapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags:
        - "management: adapters"
      operationId: UpdateAdapterPolicy
      summary: Update policy in adapter
      x-permission: adapters:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
