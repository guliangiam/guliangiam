        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/actions:
    post:
      tags:
        - "management: actions"
      operationId: CreateAction
      summary: Create an identity action definition
      x-permission: actions:write
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
          headers:
            Location:
              description: URL of the created resource or redirect target.
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags:
        - "management: actions"
      operationId: ListActions
      summary: List identity action definitions
      x-permission: actions:read
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List identity action definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/actions/{actionId}/execution-logs:
    get:
      tags:
        - "management: actions"
      operationId: ListActionExecutionLogs
      summary: List execution logs for an action
      x-permission: actions:read
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List execution logs for an action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/actions/{actionId}/run:
    post:
      tags:
        - "management: actions"
      operationId: RunAction
      summary: Execute an identity action on demand
      x-permission: actions:write
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Execute an identity action on demand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/actions/{actionId}/versions:
    get:
      tags:
        - "management: actions"
      operationId: ListActionVersions
      summary: List versions of an action
      x-permission: actions:read
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List versions of an action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - "management: actions"
      operationId: PublishActionVersion
      summary: Publish a new code version for an action
      x-permission: actions:write
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/actions/{id}:
    get:
      tags:
        - "management: actions"
      operationId: GetAction
      summary: Get an action definition by ID
      x-permission: actions:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Get an action definition by ID
          content:
