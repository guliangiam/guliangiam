        '200':
          description: OAuth 2.0 Protected Resource Metadata (RFC 9728)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/openid-configuration:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetOpenIDConfiguration
      summary: OpenID Connect Discovery
      x-permission: public
      responses:
        '200':
          description: OpenID Connect Discovery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/saml-metadata:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetSAMLMetadata
      summary: SAML metadata discovery
      x-permission: public
      responses:
