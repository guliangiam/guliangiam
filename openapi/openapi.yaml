paths:
  /.well-known/jwks-gm.json:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetGMJWKS
      summary: JSON Web Key Set (SM2-SM3)
      x-permission: public
      responses:
        '200':
          description: JSON Web Key Set (SM2-SM3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/jwks.json:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetJWKS
      summary: JSON Web Key Set
      x-permission: public
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/oauth-authorization-server:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetOAuthAuthorizationServer
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      x-permission: public
      responses:
        '200':
          description: OAuth 2.0 Authorization Server Metadata (RFC 8414)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/oauth-protected-resource:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetOAuthProtectedResource
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      x-permission: public
