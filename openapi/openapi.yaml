        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/adapters:
    post:
      tags:
        - "management: adapters"
      operationId: CreateAdapter
      summary: Create Casbin adapter
      x-permission: adapters:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdapterRequest'
      responses:
        '201':
