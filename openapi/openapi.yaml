  /.well-known/scim-configuration:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetSCIMConfiguration
      summary: SCIM service provider configuration discovery
      x-permission: public
      responses:
        '200':
          description: SCIM service provider configuration discovery
          content:
