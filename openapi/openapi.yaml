components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieSession:
      type: apiKey
      in: cookie
      name: session
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page (default 20, maximum 100; a larger value is rejected with 422).
    SortField:
      name: sortField
      in: query
      required: false
      schema:
        type: string
      description: API field name to sort by, camelCase; an unlisted field is rejected with 422. Every ORDER BY ends with the id tiebreaker.
    SortOrder:
      name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort direction.
    Keyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
      description: Free-text filter applied by every list handler. The name is `keyword` end to end — the console's search box sends it and the transport layer reads it; an alias such as `search` is read by nobody and turns the search box into a silent no-op.
    OrganizationID:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Restrict the result to one organization. It narrows the row set only; tenant isolation is enforced by RLS and is never delegated to this parameter.
    Filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: >-
        SCIM filter expression (RFC 7644 §3.4.2.2); accepted only on
        /scim/v2/* endpoints. Never interpolated into SQL as-is.
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        1-based row offset (RFC 7644 §3.4.2.4), not a page number;
        values below 1 are normalized to 1.
    ScimCount:
      name: count
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: >-
        Desired page size (RFC 7644 §3.4.2.4); values below 1 are
        normalized to 100, values above 100 are rejected with 400
        scimType=tooMany.
    ScimSortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        default: id
      description: >-
        SCIM attribute path, case-insensitive (RFC 7643 §2.1).
        Users whitelist: id, userName, userType, status, isAdmin,
        isForbidden, score, lastSigninAt, createdAt, updatedAt,
        meta.created, meta.lastModified. Groups whitelist: id,
        displayName, createdAt, updatedAt, meta.created,
        meta.lastModified. An unlisted path is rejected with 400
        scimType=invalidValue. Every ORDER BY ends with the id
        tiebreaker.
    ScimSortOrder:
      name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum: [ascending, descending]
        default: ascending
      description: SCIM sort direction (RFC 7644 §3.4.2.3).
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource unique identifier.
  responses:
    ErrorResponse:
      description: Application error response (see manual appendix C.1).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OAuthErrorResponse:
      description: OAuth 2.0 protocol error response (RFC 6749 section 5.2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - requestId
        - traceId
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            messageKey:
              type: string
              description: Optional fine-grained i18n key (messageKey > code > message).
            details:
              type: object
              additionalProperties: true
              description: Structured field-level detail (canonical key); same payload as the deprecated meta alias.
            meta:
              type: object
              additionalProperties: true
              deprecated: true
              description: Deprecated compatibility alias of details; always carries the same value. Removed after the announced window.
        requestId:
          type: string
          description: Request correlation id echoed from X-Request-Id (generated when absent).
        traceId:
          type: string
          description: W3C trace id; falls back to requestId when no span is recording.
    OAuthErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
        error_uri:
          type: string
    OperationStatusResponse:
      type: object
      properties:
        status:
          type: string
        msg:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Operation-specific details such as the IDV provider redirect URL.
    CreateApplicationResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
        clientSecretPlain:
          type: string
          description: One-time client secret plaintext; present only when the selected auth method issues a secret. Never returned by read endpoints.
        clientSecretPrefix:
          type: string
          description: Non-secret display prefix (gl_cs_ plus six random characters).
    RotateClientSecretResponse:
      type: object
      required:
        - clientSecretPlain
        - clientSecretPrefix
        - rotatedAt
        - graceUntil
      properties:
        clientSecretPlain:
          type: string
          description: One-time new client secret plaintext; read endpoints expose only clientSecretSet/clientSecretMasked.
        clientSecretPrefix:
          type: string
        rotatedAt:
          type: string
          format: date-time
        graceUntil:
          type: string
          format: date-time
          description: End of the acceptance window for the previous secret (default 24h, configurable).
    PaginatedResponse:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          $ref: '#/components/schemas/PageMeta'
    ResourceDetail:
      type: object
      additionalProperties: true
    ApplicationDetail:
      type: object
      properties:
        clientSecretSet:
          type: boolean
          description: Whether a client secret is configured for this application; never the secret itself.
        clientSecretMasked:
          type: string
          description: Masked display value (secret prefix plus bullets) of the configured client secret; never the plaintext or its hash.
        clientJwks:
          type: object
          description: Read-only public projection of the client JWKS registered for private_key_jwt; private key members are never returned.
          required:
            - kids
            - keys
          properties:
            kids:
              type: array
              items:
                type: string
            keys:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - kty
                  - kid
                properties:
                  kty:
                    type: string
                  kid:
                    type: string
                  use:
                    type: string
                  alg:
                    type: string
                  n:
                    type: string
                  e:
                    type: string
                  crv:
                    type: string
                  x:
                    type: string
                  y:
                    type: string
        jwksUri:
          type: string
          format: uri
          description: Remote JWKS location configured for private_key_jwt; absent when only inline JWKS is registered.
      additionalProperties: true
    EntryTranscriptPage:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent at the end of the sequence.
        redactedFields:
          type: array
          items:
            type: string
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AddAdapterPolicyRequest:
      type: object
      properties:
        ptype:
          type: string
        policy:
          type: array
          items:
            type: string
    AddEnforcerPolicyRequest:
      type: object
      properties:
        ptype:
          type: string
        policy:
          type: array
          items:
            type: string
    AddTicketMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
    AdminRebindTOTPRequest:
      type: object
      required:
        - confirm
        - reason
      properties:
        confirm:
          type: boolean
          description: Second confirmation; false is rejected with 400.
        reason:
          type: string
          description: Operator-supplied justification recorded in the audit trail.
    AppLoginResult:
      type: object
      properties:
        organizationSlug:
          type: string
        applicationSlug:
          type: string
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type: string
        captchaRequired:
          type: boolean
        faceIdEnabled:
          type: boolean
        web3Enabled:
          type: boolean
    ApplicationClientCertificateList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - fingerprintSha256
              - selfSigned
              - status
            properties:
              fingerprintSha256:
                type: string
                description: RFC 8705 x5t#S256, a 43-character base64url SHA-256 of the DER certificate.
              notAfter:
                type: string
                format: date-time
              selfSigned:
                type: boolean
              status:
                type: string
    ApplicationDeleteSummary:
      type: object
      properties:
        userCount:
          type: integer
        sessionCount:
          type: integer
        tokenCount:
          type: integer
    ApplicationPublicDetail:
      type: object
      description: >-
        Anonymous pre-login discovery projection shared by
        /api/v1/applications/by-client-id/{clientId} and /api/v1/applications/resolve.
        Carries branding, behavior switches and UI customization (CSS/HTML are
        sanitized client-side; script execution is not supported). SAML material,
        callback allowlists, internal override URLs, transport configuration,
        token policy and client secret material are never present.
      additionalProperties: false
      properties:
        id:
          type: string
        organizationId:
          type: string
        slug:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        homepageUrl:
          type: string
        clientId:
          type: string
        logo:
          type: string
        title:
          type: string
        favicon:
          type: string
        isShared:
          type: boolean
        enableAutoSignin:
          type: boolean
        enableSignup:
          type: boolean
        forcedRedirectOrigin:
          type: string
        signupUrl:
          type: string
        forgetUrl:
          type: string
        termsOfUse:
          type: string
        privacyPolicy:
          type: string
        orgChoiceMode:
          type: string
        signinHtml:
          type: string
        signupHtml:
          type: string
        headerHtml:
          type: string
        footerHtml:
          type: string
        customCss:
          type: string
        customHeader:
          type: string
        formCss:
          type: string
        formCssMobile:
          type: string
        formSideHtml:
          type: string
        formBackgroundUrl:
          type: string
        formBackgroundUrlMobile:
          type: string
        formOffset:
          type: string
        signinMethods:
          type: array
          items:
            type: string
        signinItems:
          type: array
          items:
            type: object
            additionalProperties: true
        signupItems:
          type: array
          items:
            type: object
            additionalProperties: true
    AuthAccountContext:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        organizationId:
          type: string
        organizationSlug:
          type: string
        applicationId:
          type: string
        permissions:
          type: array
          items:
            type: string
        isAdmin:
          type: boolean
        isOwner:
          type: boolean
        needUpdatePassword:
          type: boolean
    AuthAuthorizeRequest:
      type: object
      required:
        - client_id
        - redirect_uri
        - response_type
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
        response_type:
          type: string
        scope:
          type: string
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
    AuthAuthorizeResponse:
      type: object
      properties:
        code:
          type: string
        redirect_uri:
          type: string
        consent_required:
          type: boolean
    AuthConsentEvaluationRequest:
      type: object
      required:
        - client_id
        - scope
      properties:
        client_id:
          type: string
        scope:
          type: string
    AuthConsentEvaluationResponse:
      type: object
      properties:
        consent_required:
          type: boolean
        scopes:
          type: array
          items:
            type: string
    AuthConsentRequest:
      type: object
      required:
        - client_id
        - scope
      properties:
        client_id:
          type: string
        scope:
          type: string
    AuthConsentResponse:
      type: object
      properties:
        status:
          type: string
        scope:
          type: string
    AuthLoginRequest:
      type: object
      description: >-
        Login request document. The first factor is either password, a
        one-time verification code (verificationCode + verificationType) or an
        issued MFA challenge (challengeId + passcode/recoveryCode); the
        application layer rejects invalid combinations. captchaToken/captchaId
        are required when the organization enables a captcha provider.
      properties:
        organizationSlug:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        applicationId:
          type: string
        challengeId:
          type: string
        mfaType:
          type: string
        passcode:
          type: string
        recoveryCode:
          type: string
        verificationCode:
          type: string
        verificationType:
          type: string
          enum:
            - email
            - sms
        captchaToken:
          type: string
        captchaId:
          type: string
        rememberMeToken:
          type: string
        enableMfaRemember:
          type: boolean
        responseType:
          type: string
        redirectUri:
          type: string
        state:
          type: string
        nonce:
          type: string
        scope:
          type: array
          items:
            type: string
        codeChallenge:
          type: string
        codeChallengeMethod:
          type: string
        resource:
          type: string
        samlRequest:
          type: string
        relayState:
          type: string
        casService:
          type: string
    AuthLoginResponse:
      type: object
      description: >-
        Login result document. status discriminates the three outcomes:
        success (account context + optional protocol artifacts), mfa_required
        (challenge fields + available methods) and required_mfa_setup.
      required:
        - status
        - needUpdatePassword
      properties:
        status:
          type: string
          enum:
            - success
            - mfa_required
            - required_mfa_setup
        account:
          type: object
          properties:
            id:
              type: string
            owner:
              type: string
            name:
              type: string
            displayName:
              type: string
            avatar:
              type: string
            isAdmin:
              type: boolean
        organization:
