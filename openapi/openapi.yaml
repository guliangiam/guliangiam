              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/webfinger:
    get:
      tags:
        - "protocol: wellknown"
      operationId: GetWebFinger
      summary: WebFinger discovery
      x-permission: public
      responses:
        '200':
          description: WebFinger discovery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
