# golangci-lint 配置（v2 语法）。
#
# 注意：v1 → v2 是破坏性变更，`disable-all`/`linters-settings`/`run.skip-dirs`/
# `gosimple`/`typecheck` 均已被移除或合并，格式化为 `formatters` 段。本文件曾长期
# 停留在 v1 语法，配合 CI 里的 `version: latest`，实际结果是配置无法加载、Go-Linter
# 作业从未真正产生结论。修改本文件后必须执行 `golangci-lint config verify`。
#
# 门禁策略（见 scripts/check-lint.sh）：历史存量以提示方式输出，只对新增/改动行
# 阻断，避免"永久红"的假门禁；`--all` 可对全仓阻断。
#
# 升级方式：`golangci-lint migrate`（会丢失注释，需人工回填）。
version: "2"
run:
  modules-download-mode: mod
linters:
  default: none
  enable:
    # 分层边界：app/transport 不得反向依赖 infra。与 scripts/check-layers.sh 互补，
    # 后者检查目录结构，这里检查真实 import。
    - depguard
    - dupl
    - errcheck
    - errname
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        # 分层边界：app/transport 不得反向依赖 infra/transport。
        # 与 scripts/check-layers.sh 互补——后者校验目录结构，这里校验真实 import。
        app-layer:
          files:
            - internal/app/**
          deny:
            - pkg: github.com/guliangiam/guliangiam/internal/infra
              desc: app layer must not import infra layer - violates layered architecture
            - pkg: github.com/guliangiam/guliangiam/internal/transport
              desc: app layer must not import transport layer - violates layered architecture
        transport-layer:
          files:
            - internal/transport/**
          deny:
            - pkg: github.com/guliangiam/guliangiam/internal/infra
              desc: transport layer must not import infra layer - violates layered architecture
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        # revive 的默认规则集含 unused-parameter，它对以接口为骨架的代码库是结构性
        # 误报：接口实现必须保留参数（`ctx`、`t`、`r`），未使用也不能删除。全量扫描
        # 下它一家贡献约 1600 条（接近总报告的一半），逐条改名或加 nolint 只会污染
        # 签名。检测「参数从未被传入不同值」交给 unparam（它能区分真问题）。
        - name: unused-parameter
          disabled: true
        - name: exported
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试代码的噪音型告警：`http.NewRequest` 不带 context、表驱动用例里重复的
      # 字面量与重复结构、超长的断言行，都是测试的常态写法。逐条修既不提升测试
      # 有效性，又会把真正的存量问题淹没在几百条噪音里。生产代码不受此排除影响
      # （noctx/errcheck 等在非测试文件里仍然是硬约束）。
      - path: _test\.go
        linters:
          - noctx
          - goconst
          - dupl
          - lll
      # G101 按「标识符含 token/secret/password/key + 字面量」启发式判定，在两类
      # 位置必然误报，且这些字面量不是凭据：
      #   1. 测试夹具：伪造的 refresh/access token、PEM 样例、本地 DSN 默认口令；
      #   2. PostgreSQL SQL 常量文件：表名/列名本身就是 token_hash、client_secret
      #      这类字符串，是 schema 词汇而非秘密。
      # 生产代码的其他位置仍然保留 G101（真实凭据不得写入仓库，见 AGENTS.md §2.5）。
      - path: _test\.go
        text: "G101"
        linters:
          - gosec
      - path: internal/infra/postgres/(applications|aigateway|dashboard|providers|tokens|users)/(sql(_misc)?|secret_rotation_audit_repo)\.go
        text: "G101"
        linters:
          - gosec
    paths:
      - api
      - web
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - api
      - web
      - third_party$
      - builtin$
      - examples$
issues:
  # 默认上限（每个 linter 50 条、同文本 3 条）会把真实存量截断：报告里满是「正好 50」
  # 的分布，既无法度量清理进度，也会让 --new-from-rev 捕获的新增问题被旧问题挤掉。
  # 显式关闭上限；输出可读性由 scripts/check-lint.sh 的截断负责。
  max-issues-per-linter: 0
  max-same-issues: 0
