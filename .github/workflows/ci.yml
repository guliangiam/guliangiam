# ============================================================
# GuliangIAM CI Pipeline (PostgreSQL-first)
# Jobs: backend / frontend / gates / linter / security / docker
# PR 阻断只覆盖 PostgreSQL 运行期门禁；MySQL、openGauss 等方言运行期
# 检查在 nightly-db.yml / national-db-ci.yml 中按夜间或手动模式执行。
# 分层归属：backend=Go build/vet/test + PG schema/RLS；
# frontend=类型/语法/构建/测试/首屏预算；linter=golangci-lint；
# gates=静态契约/文档门禁 + PG sql-runtime/回滚。
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Backend CI
  # Go build + vet + test + coverage gate
  # ──────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
          POSTGRES_PASSWORD: guliangiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guliangiam"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # python 门禁（gen_schema / check-schema-vs-db / check-rls-policy-content）依赖 PyYAML。
      # 依赖清单唯一来源是 scripts/requirements.txt，与 nightly-db.yml 共用，避免各自为政。
      - name: Install gate dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      # ── Schema 对齐门禁 (make db-schema-apply + check-schema-vs-db) ──
      # gen_schema.py 从 YAML 生成 DDL → 应用到 postgres service → 门禁脚本校验零漂移
      - name: Schema apply + consistency gate
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
        run: |
          python3 scripts/gen_schema.py --dialect postgresql --all
          # 按版本顺序应用结构迁移：V1 是冻结基线，V2+ 是生成式增量（ADR-022）。
          for f in $(find db/postgresql -maxdepth 1 -name 'V*.sql' | sort -V); do
            psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "✅ Schema applied — running YAML ↔ DB gate..."
          python3 scripts/check-schema-vs-db.py --dsn "$POSTGRES_DSN" --fail-fast

      # ── RLS POLICY 内容门禁 ──
      # 拦截 USING TRUE 恒真策略 (V6/V7 已修 secret_rotation_audit / action_versions / execution_logs)
      - name: RLS policy content gate
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
        run: |
          python3 scripts/check-rls-policy-content.py --dsn "$POSTGRES_DSN"

      # ── Build ──
      - name: Go build
        run: go build ./...

      # ── Vet ──
      - name: Go vet
        run: go vet ./...

      # ── Test (with coverage) ──
      - name: Go test
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam_test@localhost:5432/guliangiam?sslmode=disable"
        run: go test -cover -race -count=1 -timeout=120s ./internal/...

      # ── Coverage Gate（fail 低于 38% — 本地基线 41.5%，CI 与本地差异留 3% buffer）──
      - name: Coverage gate
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam_test@localhost:5432/guliangiam?sslmode=disable"
        run: |
          go test -cover -coverprofile=coverage.out -count=1 -timeout=120s ./internal/...
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # §6 自动化测试体系：覆盖率门槛（38%），低于则阻断合并
          PASS=$(echo "$COVERAGE >= 38" | bc -l)
          if [ "$PASS" -ne 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below gate 38% — blocked"
            exit 1
          fi
          echo "✅ Coverage gate passed (${COVERAGE}% >= 38%)"

  # ──────────────────────────────────────────────
  # Job 1b: P1 Seed E2E Verify
  # 唯一穿透「种子 → resolver → 中间件 → SQL/RLS → 响应」的断言。
  # 该测试在缺 P1_VERIFY_DSN 时 t.Skip，默认 go test ./... 会把它当成通过；
  # 本作业显式建隔离库并只跑这一条，且把 SKIP / no tests 判红。
  # 与 backend 并行，不进入其关键路径；-run 精确选择，不重跑整包。
  # ──────────────────────────────────────────────
  p1-seed-verify:
    name: P1 Seed E2E Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
          POSTGRES_PASSWORD: guliangiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guliangiam"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      # 库名必须以 _verify 结尾：测试自身会先 DROP SCHEMA 再重放种子。
      - name: Create isolated verify database
        env:
          PGPASSWORD: guliangiam
        run: |
          psql "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable" \
            -c "CREATE DATABASE guliangiam_p1_verify;"

      - name: Seed admin → organization list E2E (must not skip)
        env:
          ALLOW_SCHEMA_RESET: "1"
          P1_VERIFY_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam_p1_verify?sslmode=disable"
        run: |
          set -euo pipefail
          go test ./internal/bootstrap \
            -run '^TestSeedAdminSeesOrganizationList_Integration$' \
            -count=1 -timeout=300s -v 2>&1 | tee /tmp/p1-verify.log
          if grep -Eq -- '--- SKIP|no tests to run|\[证据不足\]' /tmp/p1-verify.log; then
            echo "::error::P1 integration test was skipped; it must execute against $P1_VERIFY_DSN"
            exit 1
          fi
          echo "✅ P1 seed → resolver → middleware → RLS → response E2E passed (exit 0)"

  # ──────────────────────────────────────────────
  # Job 2: Frontend CI
  # pnpm install → typecheck → lint → format → build → test → bundle budget
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # ── Install ──
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ── Dependency audit (规范 9.9：High 及以上阻断；不得以 || true 吞错) ──
      # 审计建议端点固定官方 npm registry：镜像源（如 npmmirror）无 audit
      # 端点会直接报错退出，安装源不受本步骤影响。
      - name: Dependency audit (pnpm audit)
        working-directory: web
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org

      # ── Type Check ──
      # `tsc -b`, never `tsc --noEmit`: web/tsconfig.json is `{"files": [],
      # "references": [...]}`, so a non-build invocation type-checks zero files and
      # exits 0 unconditionally. This step ran as `npx tsc --noEmit` and passed on a
      # project containing a deliberate `const x: number = "oops"`.
      - name: TypeScript check
        working-directory: web
        run: pnpm run typecheck

      # ── Lint ──
      # oxlint is the lint gate (开发规范手册 V2.8 baseline); eslint is kept as
      # an opt-in secondary check (`pnpm lint:eslint`).
      - name: Lint (oxlint)
        working-directory: web
        run: pnpm run lint

      # ── Format ──
      - name: Format check (oxfmt)
        working-directory: web
        run: pnpm run format:check

      # ── Test ──
      # vitest 是组件/页面级回归的唯一防线；此前 CI 完全不跑它。
      - name: Unit tests (vitest)
        working-directory: web
        run: pnpm run test -- --run

      # ── Build ──
      - name: Build
        working-directory: web
        run: pnpm run build

      # ── First-screen budget gate ──
      # 之前的检查只量 `dist/assets/index-*.js` 单文件（113KB），于是把 1025KB 的
      # Scalar 组算作「未超预算」。闸门改为量 index.html 真正引用的全部资源，并且
      # 要求每个首屏 vendor chunk 都在 scripts/check-bundle-budget.py 里声明过。
      - name: First-screen bundle budget
        run: python3 scripts/check-bundle-budget.py

      # 交付路径与手册 10.1 一致：web/dist。发布流水线（release.yml）通过
      # workflow_run 复用本作业的产物，因此名字必须固定，不能带 github.run_id。
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 7


  # ──────────────────────────────────────────────
  # 方言运行期集成（MySQL / openGauss / 国产库）
  # 已移出 PR 阻断路径：PostgreSQL 是运行期唯一基线（ADR-023）。
  # MySQL 8.4 DDL/回滚/runtime 见 nightly-db.yml；
  # openGauss 与 Tier3 国产库见 national-db-ci.yml（夜间或手动）。
  # ──────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # Job 3: Contract Gates (DB-056)
  # 每个门禁脚本都是阻断型：任一项失败即失败本次构建。
  # 本作业只做静态契约与文档门禁；Go build/vet/test 归 backend，
  # lint 归 linter，前端 typecheck/lint/format/test/build/bundle 归 frontend。
  # PG 运行期三件套（schema-vs-db / rls-policy-content / sql-runtime）
  # 与回滚独立性在此作业内以 PostgreSQL service 执行；非 PG 方言不进 PR。
  # ──────────────────────────────────────────────
  gates:
    name: Contract Gates (DB-056)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
          POSTGRES_PASSWORD: guliangiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guliangiam"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 本作业的静态契约/文档门禁全部是 python3 脚本（check-registry-sync、
      # check-openapi-contract、verify-docs 等），依赖 PyYAML；清单唯一来源见
      # scripts/requirements.txt。
      - name: Install gate dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # 路由派生门禁的 warn 阶段按「本次变更集」判红，需要 base commit 存在。
      # checkout 默认 fetch-depth=1，这里按需浅取一次；失败时门禁降级为全量
      # 报告（嵌套高危规则仍阻断），不会因取不到 base 而误红。
      - name: Fetch base commit for route derivation gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      # goimports 与 go.mod 的 golang.org/x/tools 对齐；脚本 verify-docs.sh 的
      # _check_gofmt 只在 PATH 中存在 goimports 时才追加分组检查，CI 不装等于
      # 这条规则从未执行过（历史 96 个文件的分组漂移就是这么漏掉的）。
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.52.0

      # 生成物门禁（gen_schema / gen_error_codes / gen_api_contracts /
      # gen_brand_palette）需要 web/node_modules 中的 oxfmt，因此本作业仍需安装
      # 前端依赖。typecheck/lint/format/test/build/bundle 由 frontend 作业承担；
      # 本作业不重复这些检查。Go build 由 backend 作业承担。

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies (generators need oxfmt)
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ── Go / 静态契约门禁 ──
      - name: Layer check
        run: bash scripts/check-layers.sh

      - name: DB convention check
        run: bash scripts/check-db-conventions.sh

      # 声明式 Schema（contracts/schema/*.yaml）与产物 DDL 的结构等价性。手工改产物、
      # 生成器漏渲染某类对象、RLS 策略缺失都只在这里暴露。
      - name: Schema parity check
        run: |
          python3 scripts/gen_schema.py --dialect postgresql --check
          python3 scripts/check-schema-parity.py

      - name: SQL portability check
        run: bash scripts/check-sql-portability.sh

      # 仓储 SQL 字面量引用的表/列必须存在于 V1 DDL。集成测试带 build tag、CI 默认
      # 不执行，因此列改名在合并前只有这一道防线。
      - name: SQL column drift check
        run: python3 scripts/check-sql-columns.py

      # 静态检查看不到类型不匹配、未使用的参数序号、多表 UPDATE 的同名列歧义以及
      # 指向不存在表的仓储；PREPARE 全部语句能在解析期一次抓住这四类。
      # 该门禁会 DROP SCHEMA 后重放 DDL，因此必须使用一次性 scratch 库（库名以
      # _sqlcheck 结尾）；脚本对开发库 guliangiam 与 production 类库名硬拒绝。
      - name: Create SQL runtime scratch database
        env:
          PGPASSWORD: guliangiam
        run: |
          psql "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable" \
            -c "CREATE DATABASE guliangiam_sqlcheck;"

      - name: SQL runtime check
        env:
          SQL_CHECK_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam_sqlcheck?sslmode=disable"
          REQUIRE_SQL_RUNTIME_CHECK: "1"
          PGOPTIONS: "-c search_path=public"
        run: python3 scripts/check-sql-runtime.py

      # 回滚脚本独立性门禁（ADR-022 结构门禁 2 / 出口条件 9 / Phase 1.5）。
      # 每个 V{N}.down.sql 都必须能**独立执行**：reset → apply up to 目标版本 → run down → 断言恢复。
      # 此前回滚只在 validate_schema_replay.sh 末尾用一次 V1 down 粗略覆盖，
      # V2/V3 版本化 down.sql 从未被执行验证。
      - name: Rollback independence check
        env:
          DATABASE_URL: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
          ALLOW_SCHEMA_RESET: "1"
        run: bash scripts/dev/check-rollback-independence.sh

      # web 发出的每个查询参数必须真的被某个 handler 读取（`search` vs `keyword`
      # 这类改名会让搜索框静默失效，且没有任何错误可见）。
      - name: API parameter contract check
        run: python3 scripts/check-api-params.py

      # 错误体必须走统一写入器；手写 {"error":…} 会丢失 requestId/traceId 并发明
      # 附录 C 之外的错误码。
      - name: Error writer check
        run: python3 scripts/check-errors.py

      # ── Cross-cutting gates ──
      # Go 格式：此前没有任何 CI 强制过 gofmt（build.yml 只在 master 触发），全仓
      # 三分之一文件未格式化，后续每个 diff 都混入无关行。
      - name: Go format check
        run: |
          unformatted=$(gofmt -l . | tr -d '[:space:]')
          if [ -n "$unformatted" ]; then
            gofmt -l .
            echo "::error::the files above are not gofmt-formatted; run gofmt -w ."
            exit 1
          fi
          unformatted=$(goimports -l . | tr -d '[:space:]')
          if [ -n "$unformatted" ]; then
            goimports -l .
            echo "::error::the files above violate import grouping (stdlib vs non-stdlib separation, sorted); run goimports -w ."
            exit 1
          fi

      # 命名唯一裁决：散落的 tenant_id/org_id、大小写变体、缩写一律拦截。
      - name: Naming check
        run: bash scripts/check-naming.sh

      # 注册表一致性：错误码 / 唯一键 / DEFAULT 等可枚举事实必须与 contracts/registries 一致。
      - name: Registry sync check
        run: python3 scripts/check-registry-sync.py

      # 生成物零差异：DDL 双副本、db/generated、前端页面注册表 §28.8、OpenAPI。
      - name: Generated artifact zero-diff
        run: bash scripts/check-generated-zero-diff.sh

      # 前端覆盖闭合：路由 ↔ 页面 ↔ 菜单 ↔ 设计报告 §28.5 必须互相闭合。
      - name: Frontend coverage closure
        run: python3 scripts/check-frontend-coverage.py

      # 前端权限 key ↔ permissions.yaml：未登记 key 会让 PermissionGuard 静默
      # 隐藏控件（无异常、无 403），tsc/lint/组件测试均不可见。
      - name: Permission key registry gate
        run: python3 scripts/check-permission-keys.py

      # 文案唯一事实源：命名空间契约、键树结构（字符串叶遮蔽子树）、语言包键一致、
      # 内联兜底掩盖的缺失键、键归属。tsc / lint / 组件测试对「键名解析不到」完全
      # 无感——曾经 /device 整页渲染原始键名而三者全绿。
      - name: i18n key gate
        run: python3 scripts/check-i18n-keys.py

      # 环境变量唯一事实源：生产代码中禁止任何直接 os.Getenv 调用（ADR-021 决策 5），
      # 仅 platform/config/env.go 和 bootstrap 启动层可以读取。
      - name: env.go single-source gate
        run: |
          if grep -rn 'os\.Getenv\b' internal/ --include='*.go' \
            | grep -v '_test\.go:' \
            | grep -v '/platform/config/' \
            | grep -v '/bootstrap/' \
            | grep -v '/platform/db/migrate.go'; then
            echo "FAIL: 生产代码中存在裸 os.Getenv 调用 — 必须通过 platform/config/env.go 暴露的 getter"
            exit 1
          fi
          echo "✅ 生产代码 os.Getenv 零残留"

      # 前端 API 路径唯一事实源：所有生产代码必须从 shared/api/paths.ts 导入路径常量，
      # 禁止硬编码 `/api/v1/...` 字符串（§2 唯一事实源）。测试文件、paths.ts 本身、
      # generated 生成物、e2e 目录豁免。
      - name: paths.ts single-source gate
        run: |
          RESIDUAL=$(grep -rnE '"/api/v1/|`/api/v1/' web/src --include='*.ts' --include='*.tsx' \
            | grep -v '\.test\.' | grep -v '/paths\.ts' | grep -v '/generated/' | grep -v '/e2e/' \
            | awk -F: '{print $1}' | sort -u | wc -l | tr -d ' ')
          if [ "$RESIDUAL" -gt 0 ]; then
            echo "FAIL: web/src 中存在 $RESIDUAL 个生产代码文件含硬编码 '/api/v1/...'，必须改用 paths.ts 常量。"
            echo "前 10 个残留文件："
            grep -rnE '"/api/v1/|`/api/v1/' web/src --include='*.ts' --include='*.tsx' \
              | grep -v '\.test\.' | grep -v '/paths\.ts' | grep -v '/generated/' | grep -v '/e2e/' \
              | awk -F: '{print $1}' | sort -u | head -10
            exit 1
          fi
          echo "✅ paths.ts 硬编码零残留"

      # UI 接线：带筛选状态的控件必须把值交给请求，否则控件看着能用、实际无效。
      - name: UI wiring check
        run: python3 scripts/check-ui-wiring.py

      # 数据流闭环：写路径事务边界、审计同事务、outbox 投递规则。
      - name: Data flow check
        run: bash scripts/check-data-flow.sh

      # AC ↔ 验收标准双向追溯。
      - name: AC traceability check
        run: python3 scripts/check-ac-traceability.py

      # ── Contract gates ──
      # The generator must be deterministic: `--check` re-renders in memory and
      # compares against the committed spec, so a route edit that was not followed
      # by a regeneration fails here.
      - name: OpenAPI generator determinism
        run: python3 scripts/gen_openapi.py --check

      - name: OpenAPI contract check
        run: bash scripts/check-openapi-contract.sh

      # Route contract + API three-surface contract (spec 4.1.3 / DB-055 / DB-063).
      - name: Route and surface contract tests
        run: |
          go test ./internal/bootstrap/ -run \
            'TestRouteContractMatchesRuntimeRouter|TestSurfaceContract|TestSurfaceForKnownPaths' -count=1

      # Docs consistency + static/contract gates.
      # BACKEND/FRONTEND/LINTER 作业已各自执行 build/vet/test/lint/前端
      # build+test+bundle；这里用 SKIP_DUPLICATE_CODE_CHECKS=1 跳过这 6 项，
      # 其余门禁仍全部执行，保证「同一检查只跑一次」且没有检查被吞掉。
      # PATH 补齐 GOPATH/bin：_check_gofmt 的 goimports 分支与 check-lint 都需要它。
      - name: Documentation gate
        env:
          SKIP_DUPLICATE_CODE_CHECKS: "1"
          ROUTE_DERIVATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: PATH="$PATH:$(go env GOPATH)/bin" RUN_CODE_CHECKS=1 bash scripts/verify-docs.sh

      # ── 前端 Form-Detail-Pattern 门禁 ──
      # 审计脚本扫描 7 类已知 bug pattern。--strict 模式下：
      #   Pattern A–F = blocker（exit non-zero）
      #   Pattern G   = warning（条件分支重名，已知存在，不阻断 CI）
      - name: Frontend form-detail-pattern gate
        run: |
          python3 scripts/check-form-detail-patterns.py --strict

  # ──────────────────────────────────────────────
  # Job 3b: Go Linter
  # golangci-lint（v2 配置）+ gosec 静态安全扫描。
  # 版本必须固定：此前用 `latest` 搭配 v1 语法的 .golangci.yml，配置直接无法加载，
  # 作业从未给出结论。.golangci.yml 已迁移到 v2 语法（`golangci-lint config verify`
  # 通过），scripts/check-lint.sh 会在运行前做同样的自检。
  # ──────────────────────────────────────────────
  linter:
    name: Go Linter & Static Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      # --strict：只阻断本次改动引入的新问题（--new-from-rev），历史存量仅作提示。
      # 存量清零后把 scripts/check-lint.sh 的默认模式切到 --all。
      - name: golangci-lint
        env:
          REQUIRE_GOLANGCI_LINT: "1"
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" config verify
          PATH="$PATH:$(go env GOPATH)/bin" bash scripts/check-lint.sh --strict

  # ──────────────────────────────────────────────
  # Job 4: Security
  # Go vulncheck + gosec + dependency review
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      # ── Go Vulnerability Check ──
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go vulnerability check
        run: govulncheck ./...

      # ── Dependency Review (PR only) ──
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # ──────────────────────────────────────────────
  # Job 5: Docker Build
  # Build image + health check (depends on backend + frontend + gates)
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, gates]
    steps:
      - uses: actions/checkout@v4

      # ── Build ──
      - name: Build Docker image
        run: docker build -t guliangiam:ci .

      # ── Health Check ──
      # Note: The app requires DB connection to fully start.
      # The health check verifies the container starts and the HTTP server binds.
      # If full /healthz requires DB, the curl may return 503 but the server is running.
      - name: Health check
        run: |
          docker run -d --name guliangiam-ci -p 8000:8000 guliangiam:ci
          sleep 5
          curl -sf http://localhost:8000/healthz || curl -sf http://localhost:8000/ || true
          docker stop guliangiam-ci

# ── §5.3 新增：性能回归门禁 ───────────────────────────────────────
  perf:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: guliangiam
          POSTGRES_DB: guliangiam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
      APP_ENV: test
      IS_PRODUCTION: "false"
      SESSION_HMAC_KEY: "ci-test-key-32bytesXXXXXXXXXXXX"
      ENCRYPTION_KEY_CURRENT: "ci-test-key-32bytesXXXXXXXXXXX"
      METRICS_SCRAPE_TOKEN: "ci-metrics-token"
      HTTP_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install vegeta
        run: go install github.com/tsenart/vegeta/v12@latest

      - name: Start server
        run: |
          go run . &
          sleep 3
          curl -sf http://localhost:8000/healthz && echo "server ready"

      - name: Run performance regression
        run: |
          chmod +x tests/perf/vegeta.sh
          bash tests/perf/vegeta.sh http://localhost:8000 15s 50

# ── §5.3 新增：gosec AST 安全扫描 ────────────────────────────────
  security-gosec:
    name: Security AST Scan (gosec)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run gosec AST scan
        run: |
          chmod +x tests/security/gosec-scan.sh
          bash tests/security/gosec-scan.sh ./internal/... high

  # ── SLO 错误预算发布门禁（可选：在仓库 Variables 设置 SLO_PROMETHEUS_URL 启用）──
  slo_gate:
    name: SLO error-budget gate
    if: ${{ vars.SLO_PROMETHEUS_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      - name: Check remaining error budget
        run: go run ./cmd/slo-budget -registry contracts/registries/slo.yaml -prometheus "${{ vars.SLO_PROMETHEUS_URL }}" -min-remaining 10
