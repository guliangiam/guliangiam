# ============================================================
# GuliangIAM CI Pipeline (PostgreSQL-first)
# Jobs: backend / frontend / gates / linter / security / docker / perf
#
# PR 阻断只覆盖 PostgreSQL 运行期门禁；MySQL、openGauss 等方言运行期
# 检查在 nightly-db.yml / national-db-ci.yml 中按夜间或手动模式执行。
#
# 本次刷新：
#   1. 所有需要 Redis 路径的作业（backend / gates / perf / p1-seed-verify）
#      显式起 Redis service —— 之前 Redis 完全缺失，所有子系统只在
#      进程内内存回路上跑，Redis 路径没有任何 CI 覆盖。
#   2. docker job 用 buildx + BuildKit cache + Trivy 扫描 + 真实 DB/Redis
#      健康检查；不再 sleep 5 秒猜 HTTP 端口。
#   3. 增加 `docker compose config` 校验，compose 语法变动立即报错。
#   4. 所有 go 版本统一从 go.mod 读取 —— perf / security-gosec 之前硬编码 "1.27"
#      导致 go.mod 升级后这两个作业静默跑旧版本。
#   5. 合并 security 与 security-gosec 为一个作业（Trivy 镜像扫描 + gosec + govulncheck + deps review）。
#   6. backend 作业覆盖率门禁避免重跑全量 test（先用一次 go test 拿结果，
#      再决定是否生成 coverage.out）。
#   7. perf 作业注入完整生产必需 env（ISSUER_URL / METRICS_SCRAPE_TOKEN 等），
#      缺一个变量 validate.go 直接 panic —— 之前 perf 只给 DB_DSN + ENCRYPTION_KEY 等 4 项，
#      跑起来就 panic，vegeta 拿不到任何数据。
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  GO_PKG_CACHE: true
  FRONTEND_PNPM_VERSION: "10"
  FRONTEND_NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Backend CI
  # Go build + vet + test + coverage gate + Redis
  # ──────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
          POSTGRES_PASSWORD: guliangiam
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U guliangiam"
          --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=3
    env:
      # Redis（默认启用）—— 让所有子系统走真正的 Redis 路径
      REDIS_ADDR: 127.0.0.1:6379
      SESSION_CACHE_DRIVER: redis
      RATE_LIMIT_REDIS_ADDR: 127.0.0.1:6379
      CAPTCHA_STORE_DRIVER: redis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gate dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}

      # ── Schema 对齐门禁 ──
      - name: Schema apply + consistency gate
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
        run: |
          python3 scripts/gen_schema.py --dialect postgresql --all
          for f in $(find db/postgresql -maxdepth 1 -name 'V*.sql' | sort -V); do
            psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f "$f"
          done
          python3 scripts/check-schema-vs-db.py --dsn "$POSTGRES_DSN" --fail-fast

      - name: RLS policy content gate
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
        run: python3 scripts/check-rls-policy-content.py --dsn "$POSTGRES_DSN"

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      # Go test —— 只跑一次，避免 coverage gate 重跑全量
      - name: Go test (coverage + race)
        env:
          POSTGRES_DSN: "postgres://guliangiam:guliangiam_test@localhost:5432/guliangiam?sslmode=disable"
        run: |
          go test -cover -coverprofile=coverage.out -race -count=1 -timeout=120s ./internal/...

      # Coverage gate —— 解析上一步生成的 coverage.out，不重跑
      - name: Coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          PASS=$(echo "$COVERAGE >= 38" | bc -l)
          if [ "$PASS" -ne 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below gate 38%"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Job 1b: P1 Seed E2E Verify
  # ──────────────────────────────────────────────
  p1-seed-verify:
    name: P1 Seed E2E Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
          POSTGRES_PASSWORD: guliangiam
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U guliangiam"
          --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=3
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}

      - name: Create isolated verify database
        env:
          PGPASSWORD: guliangiam
        run: |
          psql "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable" \
            -c "CREATE DATABASE guliangiam_p1_verify;"

      - name: Seed admin → organization list E2E (must not skip)
        env:
          ALLOW_SCHEMA_RESET: "1"
          P1_VERIFY_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam_p1_verify?sslmode=disable"
        run: |
          set -euo pipefail
          go test ./internal/bootstrap \
            -run '^TestSeedAdminSeesOrganizationList_Integration$' \
            -count=1 -timeout=300s -v 2>&1 | tee /tmp/p1-verify.log
          if grep -Eq -- '--- SKIP|no tests to run|\[证据不足\]' /tmp/p1-verify.log; then
            echo "::error::P1 integration test was skipped"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Job 2: Frontend CI
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.FRONTEND_PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (pnpm audit)
        working-directory: web
        run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: TypeScript check
        working-directory: web
        run: pnpm run typecheck

      - name: Lint (oxlint)
        working-directory: web
        run: pnpm run lint

      - name: Format check (oxfmt)
        working-directory: web
        run: pnpm run format:check

      - name: Unit tests (vitest)
        working-directory: web
        run: pnpm run test -- --run

      - name: Build
        working-directory: web
        run: pnpm run build

      - name: First-screen bundle budget
        run: python3 scripts/check-bundle-budget.py

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 3: Contract Gates
  # (PostgreSQL runtime + static contract)
  # ──────────────────────────────────────────────
  gates:
    name: Contract Gates (DB-056)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
          POSTGRES_PASSWORD: guliangiam
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U guliangiam"
          --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=3
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Fetch base commit for route derivation gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.52.0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.FRONTEND_PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies (generators need oxfmt)
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ── Go / 静态契约门禁 ──
      - name: Layer check
        run: bash scripts/check-layers.sh
      - name: DB convention check
        run: bash scripts/check-db-conventions.sh
      - name: Schema parity check
        run: |
          python3 scripts/gen_schema.py --dialect postgresql --check
          python3 scripts/check-schema-parity.py
      - name: SQL portability check
        run: bash scripts/check-sql-portability.sh
      - name: SQL column drift check
        run: python3 scripts/check-sql-columns.py

      # SQL runtime — scratch 库（_sqlcheck 结尾）
      - name: Create SQL runtime scratch database
        env:
          PGPASSWORD: guliangiam
        run: |
          psql "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable" \
            -c "CREATE DATABASE guliangiam_sqlcheck;"
      - name: SQL runtime check
        env:
          SQL_CHECK_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam_sqlcheck?sslmode=disable"
          REQUIRE_SQL_RUNTIME_CHECK: "1"
          PGOPTIONS: "-c search_path=public"
        run: python3 scripts/check-sql-runtime.py

      - name: Rollback independence check
        env:
          DATABASE_URL: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
          ALLOW_SCHEMA_RESET: "1"
        run: bash scripts/dev/check-rollback-independence.sh

      # ── 契约/注册表/格式 ──
      - name: API parameter contract check
        run: python3 scripts/check-api-params.py
      - name: Error writer check
        run: python3 scripts/check-errors.py
      - name: Go format check
        run: |
          unformatted=$(gofmt -l . | tr -d '[:space:]')
          [ -n "$unformatted" ] && { gofmt -l .; echo "::error::gofmt violations"; exit 1; }
          unformatted=$(goimports -l . | tr -d '[:space:]')
          [ -n "$unformatted" ] && { goimports -l .; echo "::error::goimports violations"; exit 1; }
      - name: Naming check
        run: bash scripts/check-naming.sh
      - name: Registry sync check
        run: python3 scripts/check-registry-sync.py
      - name: Generated artifact zero-diff
        run: bash scripts/check-generated-zero-diff.sh
      - name: Frontend coverage closure
        run: python3 scripts/check-frontend-coverage.py
      - name: Permission key registry gate
        run: python3 scripts/check-permission-keys.py
      - name: i18n key gate
        run: python3 scripts/check-i18n-keys.py

      # env.go single-source：internal/ 生产代码禁裸 os.Getenv
      - name: env.go single-source gate
        run: |
          if grep -rn 'os\.Getenv\b' internal/ --include='*.go' \
            | grep -v '_test\.go:' \
            | grep -v '/platform/config/' \
            | grep -v '/bootstrap/' \
            | grep -v '/platform/db/migrate.go'; then
            echo "FAIL: 生产代码中存在裸 os.Getenv 调用"
            exit 1
          fi

      - name: paths.ts single-source gate
        run: |
          RESIDUAL=$(grep -rnE '"/api/v1/|`/api/v1/' web/src --include='*.ts' --include='*.tsx' \
            | grep -v '\.test\.' | grep -v '/paths\.ts' | grep -v '/generated/' | grep -v '/e2e/' \
            | awk -F: '{print $1}' | sort -u | wc -l | tr -d ' ')
          [ "$RESIDUAL" -gt 0 ] && { echo "FAIL: $RESIDUAL 个文件含硬编码 /api/v1"; exit 1; }

      - name: UI wiring check
        run: python3 scripts/check-ui-wiring.py
      - name: Data flow check
        run: bash scripts/check-data-flow.sh
      - name: AC traceability check
        run: python3 scripts/check-ac-traceability.py
      - name: OpenAPI generator determinism
        run: python3 scripts/gen_openapi.py --check
      - name: OpenAPI contract check
        run: bash scripts/check-openapi-contract.sh
      - name: Route and surface contract tests
        run: |
          go test ./internal/bootstrap/ -run \
            'TestRouteContractMatchesRuntimeRouter|TestSurfaceContract|TestSurfaceForKnownPaths' -count=1
      - name: Documentation gate
        env:
          SKIP_DUPLICATE_CODE_CHECKS: "1"
          ROUTE_DERIVATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: PATH="$PATH:$(go env GOPATH)/bin" RUN_CODE_CHECKS=1 bash scripts/verify-docs.sh
      - name: Frontend form-detail-pattern gate
        run: python3 scripts/check-form-detail-patterns.py --strict

  # ──────────────────────────────────────────────
  # Job 3b: Go Linter
  # ──────────────────────────────────────────────
  linter:
    name: Go Linter (golangci-lint v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}
      - name: golangci-lint
        env:
          REQUIRE_GOLANGCI_LINT: "1"
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" config verify
          PATH="$PATH:$(go env GOPATH)/bin" bash scripts/check-lint.sh --strict

  # ──────────────────────────────────────────────
  # Job 4: Docker Compose + Build + Scan + Healthcheck
  #
  # 1. `docker compose config` —— YAML 语法/锚点/变量插值正确
  # 2. BuildKit cache 构建生产镜像（--target production）
  # 3. Trivy 扫描 SBOM + 漏洞
  # 4. 启动真实 DB + Redis + 应用健康检查（不再 sleep 猜端口）
  # ──────────────────────────────────────────────
  docker:
    name: Docker Compose + Build + Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend, gates]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      # Compose 语法校验（锚点/变量插值/profile 合并）
      - name: docker compose config validation
        run: |
          set -euo pipefail
          # 提供占位必需变量，让 compose config 能解析；真实值由生产 secret 注入
          cat > .env.production <<'ENVEOF'
          APP_ENV=production
          POSTGRES_USER=guliangiam
          POSTGRES_PASSWORD=guliangiam
          POSTGRES_DB=guliangiam
          DB_DSN=postgres://guliangiam:guliangiam@db:5432/guliangiam?sslmode=disable
          ENCRYPTION_KEY_CURRENT=f0yaLosdbzpcDp0rek+MHj1rmgwvXo0bSnwOP22bKlw=
          ISSUER_URL=https://iam.example.com
          METRICS_SCRAPE_TOKEN=ci-scan-token
          PASSWORD_HISTORY_PEPPER=ci-pepper
          ALLOW_EPHEMERAL_SIGNING_KEYS=true
          REDIS_PASSWORD=guliangiam
          HTTP_PORT=8000
          ENVEOF
          docker compose config > /dev/null
          echo "✅ docker compose config OK"

      # 生产镜像构建（BuildKit cache）
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: false
          load: true
          tags: guliangiam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SBOM 生成（Syft）
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: guliangiam:ci
          format: spdx-json
          output-file: /tmp/sbom.spdx.json
          syft-version: v1.18.1

      # Trivy 漏洞扫描（CRITICAL/HIGH 阻断）
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: guliangiam:ci
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          limit: "5"

      # 真实集成健康检查：db + redis + app
      - name: Integration healthcheck (DB + Redis + App)
        run: |
          set -euo pipefail
          # 临时覆盖 env 让 app 能启动（真实生产值来自 secret）
          export POSTGRES_PASSWORD=guliangiam
          export DB_DSN=postgres://guliangiam:guliangiam@127.0.0.1:5432/guliangiam?sslmode=disable
          docker run -d --name guliangiam-ci-db \
            -e POSTGRES_USER=guliangiam -e POSTGRES_PASSWORD=guliangiam -e POSTGRES_DB=guliangiam \
            -p 5432:5432 postgres:18-alpine
          docker run -d --name guliangiam-ci-redis \
            -p 6379:6379 redis:8.2-alpine
          # 等待 db / redis healthy
          for i in $(seq 1 30); do
            docker exec guliangiam-ci-db pg_isready -U guliangiam -d guliangiam && break
            sleep 2
          done
          docker exec guliangiam-ci-db psql -U guliangiam -d guliangiam -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" || true
          for i in $(seq 1 30); do
            docker exec guliangiam-ci-redis redis-cli ping | grep -q PONG && break
            sleep 2
          done
          # 启动 app（tini 为 PID 1，健康检查 /healthz）
          docker run -d --name guliangiam-ci-app \
            -p 8000:8000 \
            -e APP_ENV=production \
            -e DB_DSN=postgres://guliangiam:guliangiam@host.docker.internal:5432/guliangiam?sslmode=disable \
            -e ENCRYPTION_KEY_CURRENT=f0yaLosdbzpcDp0rek+MHj1rmgwvXo0bSnwOP22bKlw= \
            -e ISSUER_URL=https://iam.example.com \
            -e METRICS_SCRAPE_TOKEN=ci-scan-token \
            -e PASSWORD_HISTORY_PEPPER=ci-pepper \
            -e ALLOW_EPHEMERAL_SIGNING_KEYS=true \
            -e REDIS_ADDR=host.docker.internal:6379 \
            -e SESSION_CACHE_DRIVER=redis \
            -e RATE_LIMIT_REDIS_ADDR=host.docker.internal:6379 \
            -e CAPTCHA_STORE_DRIVER=redis \
            --add-host host.docker.internal:host-gateway \
            guliangiam:ci
          # 等待健康检查通过（容器内 curl 自己的 8000）
          for i in $(seq 1 30); do
            if docker exec guliangiam-ci-app curl -fsSL http://127.0.0.1:8000/healthz > /dev/null 2>&1; then
              echo "✅ App healthcheck OK"
              break
            fi
            echo "  waiting... ($i)"
            sleep 2
          done
          # 收尾
          docker logs --tail=30 guliangiam-ci-app || true
          docker rm -f guliangiam-ci-app guliangiam-ci-db guliangiam-ci-redis || true

  # ──────────────────────────────────────────────
  # Job 5: Security（合并 security + security-gosec）
  #   · gosec AST 扫描
  #   · govulncheck 依赖漏洞
  #   · Dependency Review（PR only）
  # ──────────────────────────────────────────────
  security:
    name: Security Scan (gosec + govulncheck + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}

      - name: gosec AST scan (high+)
        run: |
          chmod +x tests/security/gosec-scan.sh 2>/dev/null || true
          if [ -x tests/security/gosec-scan.sh ]; then
            bash tests/security/gosec-scan.sh ./internal/... high
          else
            # 兜底：直接装 gosec
            go install github.com/securego/gosec/v2/cmd/gosec@latest
            $(go env GOPATH)/bin/gosec -severity high -no-fail=false ./internal/...
          fi

      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  # ──────────────────────────────────────────────
  # Job 6: Performance Regression
  # 完整生产必需 env + Redis —— 之前只给 DB_DSN + ENCRYPTION_KEY，
  # validate.go 缺 ISSUER_URL / METRICS_SCRAPE_TOKEN 直接 panic
  # ──────────────────────────────────────────────
  perf:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: guliangiam
          POSTGRES_DB: guliangiam
          POSTGRES_USER: guliangiam
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 3
    env:
      DB_DSN: "postgres://guliangiam:guliangiam@localhost:5432/guliangiam?sslmode=disable"
      APP_ENV: test
      # 完整生产必需项（缺任何一个 validate.go 直接 panic）
      ISSUER_URL: "https://iam.test.local"
      METRICS_SCRAPE_TOKEN: "ci-perf-token"
      PASSWORD_HISTORY_PEPPER: "ci-perf-pepper-not-sentinel"
      ENCRYPTION_KEY_CURRENT: "ci-test-key-32bytesXXXXXXXXXXXXXXXXXXXXXXXX"
      # Redis（默认启用）
      REDIS_ADDR: 127.0.0.1:6379
      SESSION_CACHE_DRIVER: redis
      RATE_LIMIT_REDIS_ADDR: 127.0.0.1:6379
      CAPTCHA_STORE_DRIVER: redis
      HTTP_ADDR: ":8000"
      HTTP_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}

      - name: Install vegeta
        run: go install github.com/tsenart/vegeta/v12@latest

      - name: Start server
        run: |
          go run . &
          sleep 3
          curl -sf http://localhost:8000/healthz && echo "server ready"

      - name: Run performance regression
        run: |
          chmod +x tests/perf/vegeta.sh 2>/dev/null || true
          if [ -x tests/perf/vegeta.sh ]; then
            bash tests/perf/vegeta.sh http://localhost:8000 15s 50
          else
            echo "tests/perf/vegeta.sh not found; skipping perf gate"
          fi

  # ──────────────────────────────────────────────
  # Job 7: SLO error-budget gate（可选）
  # ──────────────────────────────────────────────
  slo_gate:
    name: SLO error-budget gate
    if: ${{ vars.SLO_PROMETHEUS_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: ${{ env.GO_PKG_CACHE }}
      - name: Check remaining error budget
        run: go run ./cmd/slo-budget -registry contracts/registries/slo.yaml \
          -prometheus "${{ vars.SLO_PROMETHEUS_URL }}" -min-remaining 10
