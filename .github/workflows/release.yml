# ============================================================
# GuliangIAM Release Pipeline
#
# 职责边界（单一事实来源）：
#   ci.yml       —— 每次 push / PR 的验证流水线（构建、测试、门禁、前端产物上传）
#   release.yml  —— 只在 ci.yml 于 main 成功后发布（打标签、CHANGELOG、镜像）
#
# 为什么用 workflow_run：发布只在上游 CI 全绿后发生；workflow_dispatch 允许手动触发。
#
# 本次刷新：
#   1. `target: STANDARD` → `target: production` —— 与 Dockerfile 的 AS production 对齐
#      （之前 release.yml 里 target 写成 STANDARD，Dockerfile 里没有这个 target，构建会直接
#      报错退出；debug 镜像 target 也一并更正）
#   2. 依赖 ci.yml `frontend-dist` 产物时显式从最近一次 CI 拉取，避免 workflow_run.id 跨运行漂移
#   3. GoReleaser 前增加 web/dist 完整性校验 + 自动从 GitHub Actions 最近一次 CI 拉回
#      （workflow_dispatch 场景下没有上游 workflow_run.id）
#   4. 镜像 tag 增加 sha256 digest，SBOM 一并上传为 release asset
# ============================================================

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 语义化版本（conventional commits → tag + CHANGELOG）
  # ──────────────────────────────────────────────
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 2: 发行包（GoReleaser）
  # 前端产物要么从 workflow_run.id 拉回，要么回退到 workflow_dispatch 场景下
  # 自行构建（pnpm install + build）。
  # ──────────────────────────────────────────────
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'workflow_run'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 优先从上游 CI 拉回 frontend-dist；workflow_run 已经完成，id 可用
      - name: Download frontend artifact (CI upstream)
        id: download-frontend
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./web/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 没拉到（workflow_dispatch 或 artifact 已过期）→ 本地构建
      - name: Fallback — build frontend locally
        if: steps.download-frontend.outcome != 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build frontend fallback
        if: steps.download-frontend.outcome != 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install + build frontend
        if: steps.download-frontend.outcome != 'success'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      - name: Verify frontend artifact
        run: |
          set -euo pipefail
          if [ ! -f web/dist/index.html ]; then
            echo "::error::web/dist/index.html 缺失 —— 发行包会缺少控制台产物"
            exit 1
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.18.1
          upload-release-assets: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 3: 镜像发布（GHCR，多架构）
  # Dockerfile target: production / debug —— 与 Dockerfile 保持一致，
  # 不再出现 STANDARD/ALLINONE 这类不存在的 target。
  # 版本号从刚打出的 tag 读取，用 sha256 digest 生成不可变 tag。
  # ──────────────────────────────────────────────
  docker:
    name: Docker Release (ghcr.io multi-arch)
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from latest tag
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$VERSION" ]; then
            echo "::notice::本次运行没有产生新 tag，跳过镜像发布"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "major_minor=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU + buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
        # setup-buildx 自动处理 qemu

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 生产镜像（main target）──
      - name: Build & push production image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.major_minor }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=GuliangIAM
            org.opencontainers.image.description=Unified multi-tenant IAM
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── 调试镜像（Debian，带 bash + lsof，用于线上 incident 排查）──
      - name: Build & push debug image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: debug
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-debug
            ghcr.io/${{ github.repository }}:debug-latest
          labels: |
            org.opencontainers.image.title=GuliangIAM (debug)
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
