# ============================================================
# GuliangIAM Release Pipeline
#
# 职责边界（单一事实来源）：
#   ci.yml       —— 每次 push / PR 的验证流水线（构建、测试、门禁、前端产物上传）
#   release.yml  —— 只在 ci.yml 于 main 成功后发布（打标签、CHANGELOG、镜像）
#
# 为什么用 workflow_run：旧 build.yml 里另有一套 tag-release/github-release/
# docker-release，与 release.yml 的 semantic-release 同时存在，等于对"什么是发布"
# 有两个答案；而它整体挂在 push: master 上（本仓库唯一分支是 main），从未执行。
# 现在验证与发布各自只有一处定义，发布只在上游 CI 成功后发生。
#
# 本次修复的确定性缺陷（此前仓库里连一个 tag 都没有）：
#   1. 安装步骤用 `npm ci`，但仓库根目录只有 pnpm-lock.yaml、没有 package-lock.json
#      —— `npm ci` 必然失败，semantic-release 因此从未跑通。
#   2. @semantic-release/github 的资产路径写成 dist/**，前端产物实际在 web/dist。
#   3. 发行包与镜像来自 build.yml / .goreleaser.yaml，两处都指向 CRA 时代的
#      web/build。前端交付路径以手册 10.1 为准：web/dist。
#   4. 镜像名硬编码了外部组织的命名空间（casbin/*）并从外部仓库拉取 helm chart，
#      与"单一事实来源"冲突；现在镜像发布到 ghcr.io/<本仓库>。
#
# 需要的外部配置：无（只使用 GITHUB_TOKEN）。
# ============================================================

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 语义化版本（依据 conventional commits 打 tag + 写 CHANGELOG）
  # ──────────────────────────────────────────────
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 与仓库声明的包管理器一致：根目录只有 pnpm-lock.yaml。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 2: 发行包（GoReleaser）
  # 前端产物直接复用上游 CI 运行上传的 frontend-dist，因此发行包里一定带着控制台，
  # 且路径与手册 10.1 一致（web/dist）。
  #
  # 说明：.releaserc.json 的 @semantic-release/github 不再声明 assets —— 它原先指向
  # 仓库根目录的 dist/**（不存在），每次发布只会产生告警；发行包资产统一由本作业产出。
  # ──────────────────────────────────────────────
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'workflow_run'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 产物来自上游 CI 运行，必须显式指定 run-id。
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./web/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ./go.sum

      - name: Verify frontend artifact
        run: |
          set -euo pipefail
          if [ ! -f web/dist/index.html ]; then
            echo "::error::web/dist/index.html 缺失 —— 发行包会缺少控制台产物"
            exit 1
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.18.1
          upload-release-assets: false

      - name: Verify SBOM
        run: |
          set -euo pipefail
          python3 scripts/release/check_sbom.py dist/sbom.spdx.json
          sha256sum dist/sbom.spdx.json > dist/sbom.spdx.json.sha256
          python3 scripts/release/check_sbom.py dist/sbom.spdx.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 3: 镜像发布（GHCR，多架构）
  # 版本号从刚打出的 tag 读取，避免在作业之间传递 semantic-release 输出。
  # ──────────────────────────────────────────────
  docker:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from latest tag
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$VERSION" ]; then
            echo "::notice::本次运行没有产生新 tag，跳过镜像发布"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push standard image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Push all-in-one image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ALLINONE
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-all-in-one:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-all-in-one:latest
