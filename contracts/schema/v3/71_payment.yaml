- name: ck_pay_refunds_channel
  type: check
  expr: channel IN ('alipay', 'wxpay', 'stripe', 'paypal', 'adyen', 'airwallex', 'paddle', 'fastspring', 'lemonsqueezy', 'polar', 'balance', 'gc', 'dummy')
- name: uq_pay_refunds_channel_out_no
