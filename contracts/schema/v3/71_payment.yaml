table_name: guliangiam.pay_recon_items
pk: id
columns:
- name: id
  type: UUID
  nullable: false
- name: batch_id
  type: UUID
  nullable: false
- name: diff_type
  type: VARCHAR(30)
  nullable: false
- name: channel_order_no
  type: VARCHAR(255)
  nullable: true
- name: local_payment_id
  type: UUID
  nullable: true
- name: channel_amount
  type: DECIMAL(19, 4)
  nullable: true
- name: local_amount
  type: DECIMAL(19, 4)
  nullable: true
- name: channel_state
  type: VARCHAR(50)
  nullable: true
- name: local_state
  type: VARCHAR(50)
  nullable: true
- name: resolved
  type: BOOLEAN
  nullable: false
  default: 'false'
- name: resolved_by
  type: VARCHAR(255)
  nullable: true
  default: ''''''
- name: resolved_at
  type: TIMESTAMPTZ
  nullable: true
- name: note
  type: VARCHAR(1000)
  nullable: true
  default: ''''''
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: NOW()
constraints:
- name: ck_pay_recon_items_diff_type
  type: check
  expr: diff_type IN ('missing_local', 'missing_channel', 'amount_mismatch', 'state_mismatch', 'refund_mismatch')
indexes:
- name: idx_pay_recon_items_batch
  columns:
  - batch_id
- name: idx_pay_recon_items_resolved
  columns:
  - resolved
soft_delete: false
revision: false
rls: false
fk_constraints:
- column: batch_id
  ref_table: guliangiam.pay_recon_batches
  on_delete: CASCADE
  on_update: CASCADE
