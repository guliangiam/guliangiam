- name: completed_at
  type: TIMESTAMPTZ
  nullable: true
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: NOW()
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: NOW()
- name: deleted_at
  type: TIMESTAMPTZ
  nullable: true
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
constraints:
- name: ck_pay_refunds_state
