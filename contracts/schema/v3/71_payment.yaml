  nullable: false
  default: '''requested'''
- name: reason
  type: VARCHAR(500)
  nullable: true
  default: ''''''
- name: channel_refund_no
  type: VARCHAR(255)
  nullable: true
- name: error_code
  type: VARCHAR(100)
  nullable: true
- name: error_message
  type: VARCHAR(2000)
  nullable: true
- name: requested_at
  type: TIMESTAMPTZ
  nullable: false
