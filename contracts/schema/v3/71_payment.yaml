- name: idx_pay_refunds_state
  columns:
  - state
soft_delete: true
revision: true
rls: true
fk_constraints:
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: RESTRICT
  on_update: CASCADE
- column: payment_id
  ref_table: guliangiam.payments
  on_delete: RESTRICT
  on_update: CASCADE
