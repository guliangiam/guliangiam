---
table_name: guliangiam.llm_providers
pk: id
columns:
- name: id
  type: UUID
  nullable: false
- name: organization_id
  type: UUID
  nullable: false
- name: name
  type: VARCHAR(255)
  nullable: false
- name: display_name
  type: VARCHAR(255)
  nullable: true
  default: ''''''
- name: provider_type
  type: VARCHAR(50)
  nullable: false
- name: base_url
  type: VARCHAR(500)
  nullable: false
- name: api_key_sealed
  type: TEXT
  nullable: false
- name: api_key_fingerprint
  type: VARCHAR(64)
  nullable: false
- name: status
  type: TEXT
  nullable: false
  default: '''active'''
- name: request_timeout_ms
  type: INTEGER
  nullable: false
  default: '30000'
- name: max_retries
  type: INTEGER
  nullable: false
  default: '2'
- name: priority
  type: INTEGER
  nullable: false
  default: '100'
- name: weight
  type: INTEGER
  nullable: false
  default: '1'
- name: rpm_limit
  type: INTEGER
  nullable: true
- name: tpm_limit
  type: INTEGER
  nullable: true
- name: supported_protocols
  type: JSONB
  nullable: true
  default: '''[]'''
- name: preferred_protocol
  type: VARCHAR(30)
  nullable: false
  default: '''openai'''
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: NOW()
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: NOW()
- name: deleted_at
  type: TIMESTAMPTZ
  nullable: true
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
constraints:
- name: uq_llm_providers_org_name
  type: unique
  columns:
  - organization_id
  - name
  predicate: deleted_at IS NULL
- name: ck_llm_providers_status
  type: check
  expr: status IN ('active', 'disabled', 'testing')
- name: ck_llm_providers_provider_type
  type: check
  expr: provider_type IN ('openai', 'anthropic', 'gemini', 'deepseek', 'glm', 'kimi', 'qwen', 'seed', 'ollama', 'vllm', 'custom')
- name: ck_llm_providers_preferred_protocol
  type: check
  expr: preferred_protocol IN ('openai', 'anthropic', 'gemini')
indexes:
- name: idx_llm_providers_org
  columns:
  - organization_id
- name: idx_llm_providers_status
  columns:
  - status
soft_delete: true
revision: true
rls: true
fk_constraints:
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: RESTRICT
  on_update: CASCADE
