# Platform Admin — 平台级管理员（跨租户 scope 授权）
# 设计背景：platform_admins 不受 organization_id 约束，可操作所有租户，
# 但必须同时持有 platform_admin_scopes 赋予的跨租户作用域才生效。
# 存在于 guliangiam.platform_admins 表 — 结构链 V6 引入（schema 补全：
# 声明层之前遗漏此表，但 Go 代码 infra/postgres/platform_admins/ 已有
# 完整仓储实现，seed V1 必须 INSERT 一条 admin membership）。
table_name: guliangiam.platform_admins
comment: Platform admin registry — cross-tenant operator credentials and scope
pk: id
columns:
- { name: id, type: UUID, nullable: false, comment: Platform admin primary key }
- { name: user_id, type: UUID, nullable: false, comment: FK -> users.id (admin user) }
- { name: created_by, type: UUID, comment: FK -> users.id (creating admin; nullable for bootstrap) }
- { name: is_active, type: BOOLEAN, nullable: false, default: "true", comment: Master on/off switch for this platform admin }
constraints:
- { name: uq_platform_admins_user_id, type: unique, columns: [user_id] }
fk_constraints:
- { column: user_id, ref_table: guliangiam.users, on_delete: CASCADE }
- { column: created_by, ref_table: guliangiam.users, on_delete: SET_NULL }
# uq_platform_admins_user_id already provides the leftmost user_id index, so a
# separate non-unique index on the same column was redundant (check-redundant-index).
# No secondary indexes are declared for this table.
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin()


