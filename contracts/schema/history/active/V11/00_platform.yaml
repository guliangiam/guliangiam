# Platform Admin Scope — 平台管理员的跨租户作用域授权
# scope_type + target_tenants 共同定义作用域：
#   'all'      → 可操作全部租户（target_tenants 必须为空数组）
#   'targeted' → 仅可操作 target_tenants[] 列出的租户
# 有效性（唯一口径，Gate 7 SQL / 列表查询 / ResolveAdminScope 共用）：
#   未过期 && (is_bootstrap || approved_by 非空)
# is_bootstrap 只允许种子/运维为 built-in 组织的种子管理员写入；应用层 CreateScope 不得创建。
table_name: guliangiam.platform_admin_scopes
comment: Cross-tenant scopes granted to platform admins (with expiry and approval)
pk: id
columns:
- { name: id, type: UUID, nullable: false, comment: Scope primary key }
- { name: platform_admin_id, type: UUID, nullable: false, comment: FK -> platform_admins.id }
- { name: scope_type, type: VARCHAR(32), nullable: false, comment: 'Scope kind: all | targeted' }
- { name: target_tenants, type: 'UUID[]', nullable: false, default: "'{}'", comment: Tenant UUIDs — empty for scope_type='all' }
- { name: approved_by, type: UUID, comment: FK -> users.id (approver; NULL for bootstrap) }
- { name: approved_at, type: TIMESTAMPTZ, comment: Approval timestamp (must be set when approved_by is set) }
- { name: is_bootstrap, type: BOOLEAN, nullable: false, default: "false", comment: 'Bootstrap exemption — seed-created built-in admin ONLY; never backfill other approved_by IS NULL rows' }
- { name: expires_at, type: TIMESTAMPTZ, nullable: false, comment: Scope expiry (max 1 year from creation) }
constraints:
- { name: ck_pas_scope_type, type: check, expr: "scope_type IN ('all', 'targeted')" }
- { name: ck_pas_all_empty_tenants, type: check, expr: "scope_type <> 'all' OR cardinality(target_tenants) = 0" }
- { name: ck_pas_targeted_has_tenants, type: check, expr: "scope_type <> 'targeted' OR cardinality(target_tenants) > 0" }
- { name: ck_pas_expires_within_year, type: check, expr: "expires_at <= created_at + INTERVAL '1 year'" }
- { name: ck_pas_expires_after_created, type: check, expr: "expires_at >= created_at" }
fk_constraints:
- { column: platform_admin_id, ref_table: guliangiam.platform_admins, on_delete: CASCADE }
- { column: approved_by, ref_table: guliangiam.users, on_delete: SET_NULL }
indexes:
- { name: idx_pas_platform_admin_id, columns: [platform_admin_id] }
revision: false
rls: true
rls_predicate: guliangiam.is_super_admin()