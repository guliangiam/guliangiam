# ───────────────────────────────────────────────────────────────────────────
# llm_provider_health — 熔断状态（tenant-less，RLS 豁免，设计 §5.4）
#
# 特殊约束：不含 organization_id，RLS 禁用，CASCADE ON DELETE
# ───────────────────────────────────────────────────────────────────────────
---
table_name: guliangiam.llm_provider_health
pk: id
columns:
- name: id
  type: UUID
  nullable: false
- name: provider_id
  type: UUID
  nullable: false
- name: state
  type: VARCHAR(32)
  nullable: false
  default: "'healthy'"
- name: consecutive_failures
  type: INTEGER
  nullable: false
  default: "0"
- name: open_until
  type: TIMESTAMPTZ
  nullable: true
- name: last_checked_at
  type: TIMESTAMPTZ
  nullable: true
- name: last_latency_ms
  type: INTEGER
  nullable: true
revision: true
constraints:
- name: ck_llm_health_state
  type: check
  columns: [state]
  expr: "state IN ('healthy', 'degraded', 'open', 'half_open')"
indexes:
- name: uq_llm_health_provider
  columns: [provider_id]
  unique: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR provider_id IN (SELECT id FROM guliangiam.llm_providers
  WHERE organization_id = guliangiam.current_organization_id())
fk_constraints:
- column: provider_id
  ref_table: guliangiam.llm_providers
  ref_column: id
  on_delete: CASCADE
  on_update: CASCADE

