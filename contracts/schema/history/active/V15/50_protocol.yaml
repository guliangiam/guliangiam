table_name: guliangiam.qr_code_sessions
pk: id
columns:
- name: id
  type: UUID
  nullable: false
- name: code_id
  type: TEXT
  nullable: false
- name: code
  type: VARCHAR(255)
  nullable: false
  default: ''''''
- name: organization_id
  type: UUID
  nullable: false
- name: application_id
  type: UUID
  nullable: false
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
- name: status
  type: VARCHAR(64)
  nullable: false
  default: '''pending'''
- name: user_id
  type: UUID
  nullable: true
- name: username
  type: VARCHAR(255)
  nullable: false
  default: ''''''
- name: ip_address
  type: VARCHAR(255)
  nullable: false
  default: ''''''
- name: user_agent
  type: VARCHAR(255)
  nullable: false
  default: ''''''
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
revision: true
rls: true
fk_constraints:
- column: application_id
  ref_table: guliangiam.applications
  on_delete: CASCADE
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: CASCADE
- column: user_id
  ref_table: guliangiam.users
  ref_column: id
  on_delete: CASCADE
  on_update: CASCADE
constraints:
- name: uq_qr_code_sessions_code_id
  type: unique
  columns:
  - code_id
# 二维码载荷（扫码端唯一持有的句柄）必须可按 code 解析，且随机 32 字节碰撞可忽略：
# 扫码/确认端点按 code 寻址，轮询/换取仍按 code_id，故 code 需要独立唯一索引。
- name: uq_qr_code_sessions_code
  type: unique
  columns:
  - code
