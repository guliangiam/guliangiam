---
# Identity Verifications — 持久化身份验证会话（Provider 会话过期后仍可审计）
# 所有 Repository 方法强制 organization_id 多租户过滤（domain/idv 注释约定）。
# RLS predicate: org 内 super_admin 或 user 本人可读写。
table_name: guliangiam.identity_verifications
comment: Identity verification durable records — survives provider session lifetime
pk: id
columns:
- { name: id, type: UUID, nullable: false, comment: Verification primary key }
- { name: organization_id, type: UUID, nullable: false, comment: FK -> organizations.id (tenant boundary) }
- { name: user_id, type: UUID, comment: FK -> users.id (nullable — pre-registration verification) }
- { name: provider, type: VARCHAR(32), nullable: false, comment: Verification provider (jumio/onfido/manual/etc) }
- { name: status, type: VARCHAR(16), nullable: false, default: "'pending'", comment: pending/in_progress/approved/rejected/expired }
- { name: redirect_url, type: TEXT, comment: Post-verification redirect URL for provider callback }
- { name: session_token, type: VARCHAR(255), comment: Provider session correlation token }
- { name: provider_ref, type: VARCHAR(255), comment: Provider-side reference (session id / verification id) }
- { name: first_name, type: VARCHAR(64), comment: Given name (from provider) }
- { name: last_name, type: VARCHAR(64), comment: Family name (from provider) }
- { name: date_of_birth, type: DATE, comment: Date of birth (from provider) }
- { name: nationality, type: VARCHAR(3), comment: ISO 3166-1 alpha-2 country code }
- { name: id_type, type: VARCHAR(32), comment: Government-issued ID type (passport/driver_license/etc) }
- { name: id_number, type: VARCHAR(128), comment: Government-issued ID number (PII — encrypted at rest) }
- { name: confidence, type: "DECIMAL(19, 4)", comment: Provider confidence score (0.0 – 1.0) }
- { name: reason, type: TEXT, comment: Reject reason or completion note }
- { name: raw_result, type: JSONB, comment: Complete provider payload (PII — encrypted at rest) }
- { name: id_number_sealed, type: TEXT, comment: v2 envelope of id_number (PII); NULL = legacy plaintext row remains }
- { name: raw_result_sealed, type: LONGTEXT, comment: v2 envelope of the raw_result plaintext payload (PII/audit); NULL = legacy plaintext row remains }
- { name: initiated_at, type: TIMESTAMP, nullable: false, comment: When user started verification }
- { name: completed_at, type: TIMESTAMP, comment: When provider returned final result }
constraints:
- { name: ck_idv_status, type: check, expr: "status IN ('pending', 'in_progress', 'approved', 'rejected', 'expired')" }
indexes:
- { name: idx_idv_org_user, columns: [organization_id, user_id, initiated_at] }
- { name: idx_idv_provider_ref, columns: [provider, provider_ref] }
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR organization_id = guliangiam.current_organization_id()
fk_constraints:
- { column: organization_id, ref_table: guliangiam.organizations, on_delete: CASCADE }
- { column: user_id, ref_table: guliangiam.users, on_delete: SET_NULL }

