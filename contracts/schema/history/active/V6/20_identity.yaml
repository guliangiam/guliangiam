table_name: guliangiam.users
pk: id
columns:
- name: id
  type: UUID
  nullable: false
  comment: User primary key (UUID)
- name: organization_id
  type: UUID
  nullable: false
  comment: Tenant org this user belongs to (RLS predicate key)
- name: username
  type: TEXT
  nullable: false
  comment: User login name, unique within organization
- name: external_id
  type: TEXT
  nullable: true
  comment: IdP subject identifier when account was created via SSO; NULL for local
    users
- name: user_type
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: 'User classification: human / service_account / bot'
- name: status
  type: VARCHAR(64)
  nullable: false
  default: '''active'''
  comment: 'Account lifecycle state: active / disabled / locked / pending_verification'
- name: is_admin
  type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Org-level admin flag; when true the user bypasses role-based permission
    checks
- name: is_forbidden
  type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Emergency block flag; when true all auth flows reject this user
- name: is_verified
  type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Whether email/phone verification has completed
- name: is_online
  type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Cached session presence flag updated by periodic heartbeat
- name: created_ip
  type: VARCHAR(50)
  nullable: false
  default: ''''''
  comment: First-seen creation IP address (varchar to tolerate IPv6 variants)
- name: signup_application_id
  type: UUID
  nullable: true
  comment: Application through which the user registered; NULL for admin-created accounts
- name: register_source
  type: TEXT
  nullable: true
  comment: 'Creation channel: self_signup | admin_create | invitation | SCIM | OpenID
    | SAML'
- name: register_type
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: 'Auth method used at signup: password | oidc | saml | webauthn | magic_link'
- name: tag
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: Free-form admin label (no schema constraint; use for internal cohorting)
- name: score
  type: INTEGER
  nullable: false
  default: '0'
  comment: Composite risk / engagement score used by admin UX sorting
- name: is_deleted
  type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Soft-delete marker; rows with true are hidden from normal queries
- name: ip_whitelist
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: Semicolon-separated CIDR list; when non-empty, login restricted to these
    ranges
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Account creation timestamp
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last row modification timestamp (always set on any update)
- name: deleted_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Soft-delete timestamp; NULL when is_deleted=false
- name: created_by
  type: UUID
  nullable: true
  comment: User UUID that created this account (admin self-serve flow)
- name: updated_by
  type: UUID
  nullable: true
  comment: User UUID that last modified this account
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter; incremented on every write
constraints:
- name: ck_users_status
  type: check
  expr: status IN ('active', 'disabled', 'locked', 'pending_verification')
- name: uq_users_org_username_active
  type: unique_partial
  columns:
  - organization_id
  - username
  predicate: deleted_at IS NULL
indexes:
- name: idx_users_org_created_at_desc
  columns:
  - organization_id
  - created_at DESC
- name: idx_users_organization_id
  columns:
  - organization_id
- name: idx_users_org_deleted
  columns:
  - organization_id
  - deleted_at
- name: idx_users_org_username_deleted
  columns:
  - organization_id
  - username
  predicate: deleted_at IS NULL
- name: idx_users_status
  columns:
  - status
  predicate: deleted_at IS NULL
- name: idx_users_org_status
  columns:
  - organization_id
  - status
  predicate: deleted_at IS NULL
soft_delete: true
revision: true
rls: true
fk_constraints:
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: RESTRICT
- name: fk_users_signup_application_id
  columns:
  - signup_application_id
  ref_columns:
  - id
  ref_table: guliangiam.applications
  on_delete: SET_NULL
---
