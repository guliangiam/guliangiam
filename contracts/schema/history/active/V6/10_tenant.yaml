table_name: guliangiam.outbox
pk: id
columns:
- name: id
  type: UUID
  nullable: false
  comment: Outbox event primary key (UUID)
- name: organization_id
  type: UUID
  nullable: true
- name: aggregate_type
  type: TEXT
  nullable: false
  comment: Source aggregate type (users / orders / sessions / ...)
- name: aggregate_id
  type: UUID
  nullable: false
  comment: Source aggregate UUID
- name: event_type
  type: TEXT
  nullable: false
  comment: Domain event type name (e.g. user.created, order.paid)
- name: event_version
  type: INTEGER
  nullable: false
  default: '1'
- name: payload
  type: JSONB
  nullable: false
  default: '''{}''::jsonb'
  comment: Full event body (structured document); consumed by subscribers without needing to re-read
    the aggregate
- name: headers
  type: JSONB
  nullable: false
  default: '''{}''::jsonb'
- name: status
  type: VARCHAR(64)
  nullable: false
  default: '''pending'''
  comment: 'Dispatch lifecycle: pending / dispatching / delivered / failed / dead_lettered'
- name: attempts
  type: INTEGER
  nullable: false
  default: '0'
- name: max_attempts
  type: INTEGER
  nullable: false
  default: '12'
- name: available_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
- name: locked_by
  type: TEXT
  nullable: true
- name: locked_at
  type: TIMESTAMPTZ
  nullable: true
- name: processed_at
  type: TIMESTAMPTZ
  nullable: true
- name: last_error
  type: TEXT
  nullable: true
  comment: Last dispatch failure message, truncated
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Event emission timestamp (transaction-committed moment)
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last row modification timestamp
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
constraints:
- name: ck_outbox_status
  type: check
  expr: status IN ('pending', 'processing', 'succeeded', 'failed', 'dead')
- name: ck_outbox_attempts
  type: check
  expr: attempts >= 0 AND attempts <= max_attempts
indexes:
- name: idx_outbox_pending_available_at
  columns:
  - available_at
  predicate: status = 'pending'
- name: idx_outbox_status_created_at
  columns:
  - status
  - created_at DESC
- name: idx_outbox_aggregate
  columns:
  - aggregate_type
  - aggregate_id
- name: idx_outbox_organization_id_created_at
  columns:
  - organization_id
  - created_at DESC
revision: true
rls: true
fk_constraints:
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: CASCADE
