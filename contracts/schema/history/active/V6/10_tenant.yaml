- { name: status, type: VARCHAR(16), nullable: false, default: "'pending'" }
- { name: verified_at, type: TIMESTAMPTZ, nullable: true }
- { name: created_at, type: TIMESTAMPTZ, nullable: false, default: "now()" }
- { name: updated_at, type: TIMESTAMPTZ, nullable: false, default: "now()" }
- name: attempts
  type: INT
  nullable: false
  default: '0'
  comment: Number of failed DNS TXT verification attempts while pending
- name: last_error
  type: VARCHAR(255)
  nullable: true
  comment: Sanitized failure classification code + short reason, truncated to 255 chars
- name: next_retry_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Earliest time this pending row may be claimed again; frozen once terminal
- name: last_checked_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Last DNS TXT query time
constraints:
- { name: uq_org_domain, type: unique, columns: [organization_id, domain] }
- { name: ck_organization_domains_status, type: check, expr: "status IN ('pending', 'verified', 'failed')" }
indexes:
- { name: idx_organization_domains_domain, columns: [domain, status] }
- { name: idx_organization_domains_status, columns: [status, created_at] }
- { name: idx_organization_domains_retry, columns: [status, next_retry_at] }
revision: false
rls: true
fk_constraints:
- { column: organization_id, ref_table: guliangiam.organizations, on_delete: CASCADE }
---
table_name: guliangiam.organization_policy_inheritance
pk: id
columns:
- { name: id, type: UUID, nullable: false }
- { name: organization_id, type: UUID, nullable: false }
- { name: policy_key, type: VARCHAR(128), nullable: false }
- { name: mode, type: VARCHAR(16), nullable: false }
- { name: source_organization_id, type: UUID, nullable: true }
- { name: created_at, type: TIMESTAMPTZ, nullable: false, default: "now()" }
- { name: updated_at, type: TIMESTAMPTZ, nullable: false, default: "now()" }
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
constraints:
- { name: uq_organization_policy_inheritance_key, type: unique, columns: [organization_id, policy_key] }
- { name: ck_organization_policy_inheritance_mode, type: check, expr: "mode IN ('inherit', 'override', 'lock')" }
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR organization_id = guliangiam.current_organization_id()
fk_constraints:
- { column: organization_id, ref_table: guliangiam.organizations, on_delete: CASCADE }
- { column: source_organization_id, ref_table: guliangiam.organizations, on_delete: SET_NULL }
