table_name: guliangiam.refresh_tokens
pk: id
columns:
- name: id
  type: UUID
  nullable: false
  comment: Refresh token primary key (UUID)
- name: user_id
  type: UUID
  nullable: false
  comment: Token owner user
- name: application_id
  type: UUID
  nullable: false
  comment: Client application the token was issued for
- name: token_hash
  type: TEXT
  nullable: false
  comment: SHA-256 of the refresh token; stored instead of plaintext
- name: token_prefix
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: First N chars of plaintext token shown in admin UIs for identification
- name: device_secret_hash
  type: TEXT
  nullable: true
  comment: Bound-device proof hash; refresh token rotation verifies same device
- name: device_secret_expires_in
  type: INTEGER
  nullable: false
  default: '0'
  comment: Seconds until device_secret_hash expires
- name: scopes
  type: TEXT[]
  nullable: false
  default: '''{}'''
  comment: Scopes this refresh token is restricted to (narrowest of parent access
    token)
- name: audience
  type: TEXT[]
  nullable: false
  default: '''{}'''
  comment: Audience carried forward from the access token family
- name: access_token_id
  type: UUID
  nullable: true
  comment: The access token this refresh token was first minted with (link for revocation
    chains)
- name: family_id
  type: UUID
  nullable: true
  comment: Rotating-token family UUID; shared across token rotation generations for
    reuse detection
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
  comment: Hard expiration; refresh rejected after this point even if unused
- name: revoked_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Revocation timestamp; part of reuse-detection flow (rotation marks previous
    gen revoked)
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: First-generation issuance timestamp
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last row modification timestamp
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
constraints:
- name: uq_refresh_tokens_hash
  type: unique
  columns:
  - token_hash
indexes:
- name: idx_refresh_tokens_family_id
  columns:
  - family_id
  predicate: family_id IS NOT NULL
- name: idx_refresh_tokens_access_token_id
  columns:
  - access_token_id
- name: idx_refresh_tokens_user_id
  columns:
  - user_id
- name: idx_refresh_tokens_expires_at_not_revoked
  columns:
  - expires_at
  predicate: revoked_at IS NULL
- name: idx_refresh_tokens_application_id
  columns:
  - application_id
- name: idx_refresh_tokens_hash
  columns:
  - token_hash
  predicate: token_hash IS NOT NULL
- name: idx_refresh_tokens_family_revoked
  columns:
  - family_id
  - revoked_at
  predicate: family_id IS NOT NULL
- name: idx_refresh_tokens_user_app
  columns:
  - user_id
  - application_id
- name: idx_refresh_tokens_user_id_created
  columns:
  - user_id
  - created_at DESC
- name: idx_refresh_tokens_application_id_created
  columns:
  - application_id
  - created_at DESC
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR EXISTS (SELECT 1 FROM guliangiam.users
  u WHERE u.id = user_id AND u.organization_id = guliangiam.current_organization_id())
fk_constraints:
- column: access_token_id
  ref_table: guliangiam.access_tokens
  on_delete: SET_NULL
- column: application_id
  ref_table: guliangiam.applications
  on_delete: CASCADE
- column: user_id
  ref_table: guliangiam.users
  on_delete: CASCADE
- column: family_id
  ref_table: guliangiam.refresh_tokens
  ref_column: id
  on_delete: CASCADE
  on_update: CASCADE
