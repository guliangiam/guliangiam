table_name: guliangiam.sessions
pk: id
columns:
- name: id
  type: UUID
  nullable: false
  comment: Session primary key (UUID)
- name: user_id
  type: UUID
  nullable: false
  comment: Owner user
- name: application_id
  type: UUID
  nullable: false
  comment: Client application the session was issued for
- name: session_state
  type: VARCHAR(64)
  nullable: false
  default: '''active'''
  comment: 'Lifecycle: active / revoked / expired / idle_timeout'
- name: sid
  type: TEXT
  nullable: true
  comment: Opaque session identifier used for session management lookups
- name: device_info
  type: JSONB
  nullable: false
  default: '''{}''::jsonb'
  comment: Client device fingerprint + OS/browser detail snapshot captured at login
- name: ip
  type: INET
  nullable: true
  comment: IP address observed at session creation / last-seen refresh
- name: user_agent
  type: TEXT
  nullable: true
  comment: Raw User-Agent header captured at session creation
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
  comment: Hard expiration timestamp; session becomes unusable after this point
- name: revoked_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Explicit revocation timestamp (admin revoke or logout); NULL when active
- name: last_seen_at
  comment: Last observed activity timestamp for session restore, idle timeout, and
    device management flows.
  type: TIMESTAMPTZ
  nullable: false
  default: now()
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Session creation timestamp
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last row modification timestamp
- name: authentication_level
  type: VARCHAR(20)
  nullable: false
  default: '''password'''
  comment: 'How the user authenticated when this session was created: password / mfa / fido2. Used by concurrent-session policy (admin session exemption requires level >= mfa).'
- name: assurance_level
  type: VARCHAR(10)
  nullable: false
  default: '''aal1'''
  comment: 'NIST SP 800-63B authenticator assurance level: aal1 (password only) / aal2 (MFA or FIDO2 satisfied). step-up raises only the current session.'
- name: is_privileged
  type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Session elevated through an approved IGA access request
- name: lifecycle_id
  type: UUID
  nullable: true
  comment: IGA lifecycle that authorizes the privileged session
- name: ticket_id
  type: UUID
  nullable: true
  comment: Access request that authorized the privileged session
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
constraints:
- name: uq_sessions_sid
  type: unique
  columns:
  - sid
- name: ck_sessions_state
  type: check
  expr: session_state IN ('active', 'idle', 'expired', 'revoked')
- name: ck_sessions_assurance_level
  type: check
  expr: assurance_level IN ('aal1', 'aal2')
indexes:
- name: idx_sessions_expires_at
  columns:
  - expires_at
- name: idx_sessions_user_active
  columns:
  - user_id
  - expires_at
  predicate: revoked_at IS NULL
- name: idx_sessions_application_id
  columns:
  - application_id
- name: idx_sessions_user_app_active
  columns:
  - user_id
  - application_id
  - expires_at
  predicate: revoked_at IS NULL
- name: idx_sessions_user_expires_revoked
  columns:
  - user_id
  - expires_at
  - revoked_at
- name: idx_sessions_expires_revoked
  columns:
  - expires_at
  - revoked_at
- name: idx_sessions_org_app_created
  columns:
  - user_id
  - application_id
  - created_at DESC
- name: idx_sessions_user_id_created
  columns:
  - user_id
  - created_at DESC
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR EXISTS (SELECT 1 FROM guliangiam.users
  u WHERE u.id = user_id AND u.organization_id = guliangiam.current_organization_id())
fk_constraints:
- column: application_id
  ref_table: guliangiam.applications
  on_delete: CASCADE
- column: user_id
  ref_table: guliangiam.users
  on_delete: CASCADE
---
table_name: guliangiam.access_tokens
pk: id
columns:
- name: id
  type: UUID
  nullable: false
  comment: Access token primary key (UUID)
- name: user_id
  type: UUID
  nullable: false
  comment: Token owner user
- name: application_id
  type: UUID
  nullable: false
  comment: Client application the token was issued for
- name: token_hash
  comment: SHA-256 hash of the token value used for lookup and revocation.
  type: TEXT
  nullable: false
- name: token_prefix
  comment: Non-sensitive prefix shown in management UIs instead of exposing the full
    token value.
  type: TEXT
  nullable: false
- name: device_secret_hash
  type: TEXT
  nullable: true
  comment: SHA-256 of the bound device secret; set only for Proof-of-Possession tokens
- name: device_secret_expires_in
  type: INTEGER
  nullable: false
  default: '0'
  comment: Seconds until device_secret_hash expires; 0 when not bound
- name: scopes
  type: TEXT[]
  nullable: false
  default: '''{}'''
  comment: Space-separated OAuth scopes granted to this token
- name: audience
  type: TEXT[]
  nullable: false
  default: '''{}'''
  comment: Intended API audiences (JWT aud claim)
- name: metadata
  type: JSONB
  nullable: false
  default: '''{}''::jsonb'
  comment: Extension attribute bag; may contain authorization_code_id, dpop_jkt, org_idp
    context etc.
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
  comment: Token lifetime end; unix timestamp in seconds
- name: revoked_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Revocation timestamp; NULL when token is active
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Token issuance timestamp
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last row modification timestamp
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
constraints:
- name: uq_access_tokens_hash
  type: unique
  columns:
  - token_hash
indexes:
- name: idx_access_tokens_authorization_code_id
  columns:
  - (metadata ->> 'authorizationCodeId')
  predicate: metadata ? 'authorizationCodeId'
- name: idx_access_tokens_expires_at
  columns:
  - expires_at
- name: idx_access_tokens_user_active
  columns:
  - user_id
  - expires_at
  predicate: revoked_at IS NULL
- name: idx_access_tokens_application_id
  columns:
  - application_id
- name: idx_access_tokens_expires_at_not_revoked
  columns:
  - expires_at
  predicate: revoked_at IS NULL
- name: idx_access_tokens_device_secret_hash
  columns:
  - device_secret_hash
  predicate: device_secret_hash IS NOT NULL
- name: idx_tokens_app_expires
  columns:
  - application_id
  - expires_at
  - revoked_at
- name: idx_access_tokens_user_app
  columns:
  - user_id
  - application_id
- name: idx_access_tokens_user_id_created
  columns:
  - user_id
  - created_at DESC
- name: idx_access_tokens_application_id_created
  columns:
  - application_id
  - created_at DESC
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR EXISTS (SELECT 1 FROM guliangiam.users
  u WHERE u.id = user_id AND u.organization_id = guliangiam.current_organization_id())
fk_constraints:
- column: application_id
  ref_table: guliangiam.applications
  on_delete: CASCADE
- column: user_id
  ref_table: guliangiam.users
  on_delete: CASCADE
