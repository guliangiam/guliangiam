table_name: guliangiam.login_challenges
pk: id
columns:
- name: id
  type: UUID
  nullable: false
- name: organization_id
  type: UUID
  nullable: true
  comment: Tenant org of the user attempting login
- name: user_id
  type: UUID
  nullable: true
  comment: User being authenticated (populated after account identification step)
- name: application_id
  type: UUID
  nullable: true
  comment: Client app that started the login flow
- name: challenge_type
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: 'MFA factor requested: totp / webauthn / sms / email / push / qr'
- name: status
  comment: Current login challenge state such as pending, push_pending, approved,
    or rejected.
  type: VARCHAR(64)
  nullable: false
  default: '''pending'''
- name: method_type
  comment: MFA method currently associated with the challenge when state transitions
    need method-specific handling.
  type: VARCHAR(255)
  nullable: false
  default: ''''''
- name: verified_at
  comment: Timestamp when an external approval path marked the challenge approved.
  type: TIMESTAMPTZ
  nullable: true
- name: identity_provider
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: IdP identifier for federated MFA; empty for local factors
- name: identity_sub
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: IdP subject claim for federated MFA correlation
- name: redirect_url
  type: VARCHAR(255)
  nullable: false
  default: ''''''
  comment: Post-login callback URL; stored at challenge creation, sent to the approval
    channel
- name: device_info
  type: JSONB
  nullable: false
  default: '''{}''::jsonb'
  comment: Device fingerprint at challenge initiation
- name: ip
  type: INET
  nullable: true
  comment: Request IP at challenge creation
- name: user_agent
  type: TEXT
  nullable: true
  comment: User-Agent header at challenge creation
- name: metadata
  type: JSONB
  nullable: false
  default: '''{}''::jsonb'
  comment: Attribute bag for factor-specific state (e.g. TOTP window, WebAuthn cred ID)
- name: expires_at
  comment: Expiration timestamp for the pending MFA login challenge.
  type: TIMESTAMPTZ
  nullable: false
- name: resolved_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Timestamp when challenge transitioned to approved/rejected state
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Challenge initiation timestamp
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last state transition timestamp
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
constraints:
- name: ck_login_challenges_status
  type: check
  expr: status IN ('pending', 'push_pending', 'approved', 'rejected')
indexes:
- name: idx_auth_login_challenges_user_id
  columns:
  - user_id
- name: idx_auth_login_challenges_expires_at
  columns:
  - expires_at
- name: idx_auth_login_challenges_status
  columns:
  - status
- name: idx_login_challenges_application_id
  columns:
  - application_id
revision: true
rls: true
fk_constraints:
- column: application_id
  ref_table: guliangiam.applications
  on_delete: CASCADE
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: CASCADE
- column: user_id
  ref_table: guliangiam.users
  on_delete: CASCADE
comment: Pending MFA login challenges created after password verification and consumed
  by second-step MFA verification.
