  type: UUID
  nullable: false
  comment: Remember-me token primary key (UUID)
- name: family_id
  type: UUID
  nullable: false
  comment: Rotating family this token belongs to
- name: organization_id
  type: UUID
  nullable: false
  comment: Tenant that owns the token (RLS anchor)
- name: token_hash
  type: TEXT
  nullable: false
  comment: SHA-256 hex of the plaintext token; plaintext is returned only once
- name: token_prefix
  type: TEXT
  nullable: false
  comment: Non-sensitive prefix for management UIs
- name: consumed_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Single-use consumption timestamp; non-NULL means already rotated
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
  comment: Token expiration (mirrors the family expiration)
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Issuance timestamp
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last row modification timestamp
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
constraints:
- name: uq_remember_me_tokens_hash
  type: unique
  columns:
  - token_hash
indexes:
- name: idx_remember_me_tokens_family
  columns:
  - family_id
- name: idx_remember_me_tokens_expires_at
  columns:
  - expires_at
  predicate: consumed_at IS NULL
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR organization_id = guliangiam.current_organization_id()
fk_constraints:
- column: family_id
  ref_table: guliangiam.remember_me_families
  on_delete: CASCADE
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: CASCADE