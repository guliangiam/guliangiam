table_name: guliangiam.webauthn_challenges
pk: id
columns:
- name: id
  type: UUID
  nullable: false
- name: challenge_hash
  comment: SHA-256 (hex) of the challenge issued by begin. The plaintext challenge
    is never persisted, so a database leak cannot be replayed as a valid ceremony.
  type: TEXT
  nullable: false
- name: ceremony_type
  comment: registration or authentication — the two ceremony kinds share one table
    but must not be interchangeable at finish. No TEXT default (check-schema-defaults.py
    freezes the legacy count of TEXT defaults; the service always sets this column).
  type: TEXT
  nullable: false
- name: user_id
  type: UUID
  nullable: false
- name: organization_id
  type: UUID
  nullable: true
- name: relying_party_id
  comment: RP ID captured at begin; finish verifies the assertion against this value
    rather than against whatever the client sends. No TEXT default for the same reason
    as ceremony_type.
  type: TEXT
  nullable: false
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
- name: consumed_at
  comment: Set exactly once by the atomic consume UPDATE. NULL means pending — the
    one-time guarantee is the RowsAffected=0 check on that conditional update.
  type: TIMESTAMPTZ
  nullable: true
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
- name: updated_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
indexes:
- name: idx_webauthn_challenges_user_id
  columns:
  - user_id
- name: idx_webauthn_challenges_expires_at
  columns:
  - expires_at
constraints:
- name: ck_webauthn_challenges_ceremony_type
  type: check
  expr: ceremony_type IN ('registration', 'authentication', 'web3_authentication')
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR EXISTS (SELECT 1 FROM guliangiam.users
  u WHERE u.id = user_id AND u.organization_id = guliangiam.current_organization_id())
fk_constraints:
- column: user_id
  ref_table: guliangiam.users
  on_delete: CASCADE

- column: organization_id
  ref_table: guliangiam.organizations
  ref_column: id
  on_delete: CASCADE
  on_update: CASCADE
---
table_name: guliangiam.trusted_devices
pk: id
columns:
- name: id
  type: UUID
  nullable: false
  comment: Trusted device primary key (UUIDv7 generated by the application)
- name: organization_id
  type: UUID
  nullable: false
  comment: Tenant that owns the trust record; also the RLS anchor
- name: user_id
  type: UUID
  nullable: false
  comment: User this device is trusted for
- name: device_credential_id
  type: TEXT
  nullable: false
  comment: SHA-256 digest of the client device credential, stored as 64 lowercase hex characters; the plaintext credential is never persisted
- name: device_public_key
  type: BYTEA
  nullable: false
  comment: Device public key (PKIX DER) used to verify the trust ceremony signature
- name: ua_hash
  type: TEXT
  nullable: false
  comment: SHA-256 hex of the User-Agent observed at registration; device trust is bound to the client profile, never to an IP address
- name: created_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Registration timestamp
- name: last_seen_at
  type: TIMESTAMPTZ
  nullable: false
  default: now()
  comment: Last time the device presented a valid trust proof
- name: expires_at
  type: TIMESTAMPTZ
  nullable: false
  comment: Hard expiration (created_at + 30 days); expired rows are no longer trusted
- name: revoked_at
  type: TIMESTAMPTZ
  nullable: true
  comment: Revocation timestamp; NULL while the device is trusted
- name: revision
  type: BIGINT
  nullable: false
  default: '1'
  comment: Optimistic concurrency counter
indexes:
- name: idx_trusted_devices_user_active
  columns:
  - user_id
  - expires_at
  predicate: revoked_at IS NULL
- name: idx_trusted_devices_org_user
  columns:
  - organization_id
  - user_id
- name: idx_trusted_devices_expires_at
  columns:
  - expires_at
revision: true
rls: true
rls_predicate: guliangiam.is_super_admin() OR (organization_id = guliangiam.current_organization_id()
  AND EXISTS (SELECT 1 FROM guliangiam.users u WHERE u.id = user_id AND u.organization_id
  = guliangiam.current_organization_id()))
fk_constraints:
- column: organization_id
  ref_table: guliangiam.organizations
  on_delete: CASCADE
- column: user_id
  ref_table: guliangiam.users
  on_delete: CASCADE
