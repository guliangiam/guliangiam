# ──────────────────────────────────────────────────────────────────────────
# surfaces.yaml — API 三面分类与端点契约机器可读注册表
#
# 唯一事实源：本文件（YAML）+ internal/transport/http/route/definition.go
# 渲染层：docs/generated/surfaces-registry.md（人类可读视图）
# 消费方：
#   1. scripts/gen_openapi.py — 端点契约由 Definition 声明生成
#   2. scripts/check-registry-sync.py — 三面常量与协议面家族前缀 ↔ route.SurfaceFor 唯一分类器
#
# 端点契约由 gen_openapi.py 从 routes.go 生成，本文件只登记分类规则
# ──────────────────────────────────────────────────────────────────────────

version: 1

# ── API 三面分类 ──────────────────────────────────────────────────────────
surfaces:
  - surface: management
    consumers: 控制台 / 管理员 API
    contract_source: 本项目自定 REST

  - surface: authentication
    consumers: 本系统登录页 / SPA
    contract_source: 本项目自定 REST

  - surface: protocol
    consumers: 外部标准客户端（RP/SP/IdP/SCIM/DCR）
    contract_source: RFC / OASIS 规定

# ── 协议面家族（七个前缀家族，由 SurfaceFor 识别） ─────────────────────────
protocol_families:
  - id: "①"
    family: 根级 OAuth2
    prefix: /oauth2/*
    typical_endpoints:
      - /oauth2/register
      - /oauth2/userinfo
      - /oauth2/token
    contract: RFC 6749 / 6750 / OIDC
    note: "UserInfo 属协议面，从 /.well-known/* 家族移出"

  - id: "②"
    family: 根级 Well-Known
    prefix: /.well-known/*
    typical_endpoints:
      - /.well-known/openid-configuration
      - /.well-known/jwks.json
      - /.well-known/jwks-gm.json
    contract: RFC 5785 / OIDC Discovery

  - id: "③"
    family: 根级 CAS
    prefix: /cas/{organizationSlug}/{applicationSlug}/*
    typical_endpoints:
      - CAS 2.0 标准 URL 形态
    contract: CAS Protocol

  - id: "④"
    family: 根级 SCIM
    prefix: /scim/v2/*
    typical_endpoints:
      - SCIM 2.0 CRUD
    contract: RFC 7644

  - id: "⑤"
    family: Auth 内协议端点
    prefix: /api/v1/auth/*
    typical_endpoints:
      - authorize
      - tokens:exchange
      - device/authorize
      - device/token
      - oauth2/revoke
      - oauth2/introspect
      - webauthn/*
    contract: RFC 6749 / OIDC / WebAuthn

  - id: "⑥"
    family: 根级 SAML
    prefix: /api/v1/saml/*
    typical_endpoints:
      - 元数据 / SSO / SLO
    contract: SAML 2.0

  - id: "⑦"
    family: AI 协议面网关
    prefix: /api/v1/ai/faces/*
    typical_endpoints:
      - OpenAI 兼容 /chat/completions
      - Anthropic 兼容 /messages
      - Gemini 兼容 生成端点
    contract: OpenAI / Anthropic / Gemini 协议兼容
    note: "AI 网关对外暴露的 LLM 协议兼容面；归 protocol 面（面外标准客户端）"

# ── 端点契约字段（由 gen_openapi.py 从 Definition 生成） ──────────────────
endpoint_contract_fields:
  - field: method
    source: Definition.Method
  - field: path
    source: Definition.Path
  - field: operationId
    source: Definition.OperationID
  - field: surface
    source: SurfaceFor(path)
  - field: permission
    source: Definition.Permission
    note: '"" = 公开'
  - field: request_schema
    source: OpenAPI
  - field: response_schema
    source: OpenAPI
  - field: idempotent
    source: Definition.Idempotent
  - field: optimistic_lock
    source: Definition.OptimisticLock

# ── 三面契约要素（唯一事实源：openapi/openapi.yaml 的 components） ──────────
# 本块登记的是「哪一面用哪个契约组件」这一分类事实；组件的具体形状是生成物，
# 不在此重复（对齐 docs/README.md 红线 1）。每个组件名都由
# scripts/check-registry-sync.py 断言在生成的 openapi/openapi.yaml 中真实存在。
contract_elements:
  error_body:
    management: ErrorResponse
    authentication: ErrorResponse
    protocol: OAuthErrorResponse
    note: 管理/认证面错误体必须走 route.WriteError（手写错误体会丢顶层 requestId/traceId，由 scripts/check-errors.py 拦截）；协议面走 OAuth 2.0 错误体（RFC 6749 §5.2）
  success_envelope:
    detail: ResourceDetail
    list: PaginatedResponse
    status: OperationStatusResponse
  auth_schemes:
    - BearerAuth
    - CookieSession
  pagination:
    request_params:
      - page
      - pageSize
    response_meta: PageMeta

# ── 门禁 ───────────────────────────────────────────────────────────────────
gates:
  - script: scripts/gen_openapi.py
    action: 生成 openapi/openapi.yaml
  - script: scripts/check-openapi-contract.sh
    action: OpenAPI 契约一致性门禁
  - script: scripts/check-http-methods.py
    action: HTTP 方法语义检查
  - script: scripts/check-api-params.py
    action: 前端查询键 ↔ 后端读取面双向校验
  - script: scripts/check-api-contract.sh
    action: API 契约完整性检查

