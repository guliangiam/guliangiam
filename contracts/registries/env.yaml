# ──────────────────────────────────────────────────────────────────────────
# env.yaml — 环境变量机器可读注册表
#
# 唯一事实源：本文件（YAML）
# 渲染层：docs/generated/env-registry.md（人类可读视图）
# 消费方：
#   1. scripts/check-registry-sync.py — os.Getenv 调用点 ↔ 注册表双向校验
#   2. scripts/gen_env_vars.py — 生成 .env.example / 校验器
#   3. scripts/check-doc-anchors.py — 文档附录 D 引用一致性
#
# 分组编号 D.1–D.10（渲染层标题由本文件的 groups 顺序生成，新增分组须同步文档引用）
# "required: true" 表示所有环境必填；"required: production" 表示仅生产必需
# "test_only: true" 表示仅被 *_test.go 读取、不参与运行时配置；门禁核验仓库内存在对应测试读取点
# ──────────────────────────────────────────────────────────────────────────

version: 1

groups:
  D1_env_and_keys:
    title: 环境标识与密钥
    vars:
      - name: APP_ENV
        required: false
        default: development
        values: [development, test, staging, production]
        description: 唯一环境标识（ADR-021）；production 触发严格校验

      - name: IS_PRODUCTION
        required: false
        default: "false"
        deprecated: true
        note: 已废弃的只读同义词；仅用于与 APP_ENV 一致性校验
        description: 与 APP_ENV 冲突即拒绝启动

      - name: SESSION_HMAC_KEY
        required: production
        min_length: 32
        retired: true
        note: 已退役（OPEN-API-22）：其唯一消费方 HMAC 签名会话 Cookie 已随 OPEN-API-20 删除；会话来源改为 sessions 仓库行（DB 强制）。保留登记仅为兼容性检查，Go 运行时无读取点
        description: Session Cookie HMAC 密钥（已退役）

      - name: SESSION_SECRET
        required: false
        deprecated: true
        retired: true
        note: 已退役兼容别名（OPEN-API-22）；仅当 SESSION_HMAC_KEY 为空时回退的历史行为已随会话 Cookie 退役而失效
        description: ADR-021 决策 2（已退役）

      - name: WEBAUTHN_REQUIRE_UV
        required: false
        default: "false"
        note: 取值仅接受 true/false/1/0；其他取值在启动校验中直接失败（拼错的开关等于静默关掉策略）
        description: WebAuthn ceremony 是否强制用户验证（UV）；作为第二因子/MFA 替代的部署必须开启（开发设计 31.3.2(b)）

      - name: SESSION_CLEANUP_INTERVAL_MINUTES
        required: false
        default: "60"
        description: 会话清理任务周期（分钟）

      - name: SESSION_CLEANUP_RETENTION_HOURS
        required: false
        default: "168"
        description: 已注销会话保留时长（小时）

      - name: CLIENT_SECRET_ROTATION_GRACE_HOURS
        required: false
        default: "24"
        note: 非正整数按默认 24h 处理；宽限期判定发生在验签时，不引入定时任务
        description: OAuth client secret 轮换宽限期（小时），窗口内旧 secret 仍可验签

      - name: ENCRYPTION_KEY_CURRENT
        required: true
        note: 所有环境必填；缺失时拒绝启动（禁止明文降级）
        description: 当前字段加密密钥（标准 Base64）；AES-256-GCM（缺省，canonical aes-256-gcm，别名 aes/aes256）需 32B，SM4-GCM（canonical sm4-gcm，别名 sm4/gmsm）需 16B；生成为 openssl rand -base64 32（AES）或 openssl rand -base64 16（SM4）；长度不符启动失败

      - name: ENCRYPTION_KEY_PREVIOUS
        required: false
        description: 前一个加密密钥（轮换期间解密旧密文）

      - name: ENCRYPTION_KEY_COMPAT
        required: false
        note: 仅解密；长度由另一算法决定（AES-256=32B、SM4=16B），映射到当前密钥版本
        description: 算法切换重叠窗口内另一算法的解密密钥（ENCRYPTION_ALGORITHM 切换时保留旧密文可读）

      - name: ENCRYPTION_KEY
        required: false
        note: 旧版加密密钥向后兼容回落
        description: 非生产环境可回落此变量

      - name: PASSWORD_HISTORY_PEPPER
        required: production
        note: 生产必须显式配置；缺失、空白或等于内置开发哨兵时拒绝启动（错误信息不打印该值）
        description: 密码历史校验用 pepper

      - name: CURSOR_HMAC_KEY
        required: false
        note: 生产必须显式配置
        description: 分页游标签名密钥

      - name: ETAG_HMAC_KEY
        required: false
        note: 生产必须显式配置
        description: ETag 签名密钥

      - name: COOKIE_SECURE
        required: false
        default: ""
        note: 未设置时 production 默认 true、其他环境默认 false；显式 true/false 可覆盖；非法值按 true 处理（fail-secure）；Secure 与 `__Host-` 前缀同步切换
        description: Cookie Secure 强制标志

      - name: ENCRYPTION_ALGORITHM
        required: false
        default: aes-256-gcm
        values: [aes-256-gcm, sm4-gcm]
        note: canonical 值 aes-256-gcm / sm4-gcm；AES 别名 aes、aes256，SM4 别名 sm4、gmsm。国密 sm4-gcm 是显式能力位；取值为不可用算法或未知值时启动失败，不得静默降级。CRYPTO_PROFILE=gm 时未设置本变量默认 sm4-gcm；gm 档显式 aes-256-gcm（或 aes/aes256 别名）启动失败
        description: 字段加密算法选择

      - name: CRYPTO_PROFILE
        required: false
        default: default
        values: [default, gm]
        note: gm 档缺少 sm2_sign / sm2_encrypt / sm3 / sm4 时拒绝启动；gm 档强制字段加密 sm4-gcm（未设置 ENCRYPTION_ALGORITHM 时自动选择，显式 AES 拒绝启动）；能力位清单见 contracts/registries/crypto.yaml
        description: 加密能力档位选择

      - name: GM_TLS_ENABLED
        required: false
        default: "false"
        note: 只是启用声明，不等于可用；能力位由 GM_TLS_SIGN_CERT_FILE / GM_TLS_SIGN_KEY_FILE / GM_TLS_ENC_CERT_FILE / GM_TLS_ENC_KEY_FILE / GM_TLS_CA_FILE 的 SM2 材料自检裁决。未启用或材料缺失/非法只降级（/healthz=degraded + degraded_reasons），不阻断 gm 档启动
        description: 国密 TLS 能力位开关

      - name: GM_TLS_SIGN_CERT_FILE
        required: false
        default: ""
        note: GM_TLS_ENABLED=true 时必填；PEM 证书，公钥必须为 SM2（OID 1.2.156.10197.1.301），签名算法为 SM2-SM3（OID 1.2.156.10197.1.501）
        description: 国密 TLS 签名证书文件路径

      - name: GM_TLS_SIGN_KEY_FILE
        required: false
        default: ""
        note: GM_TLS_ENABLED=true 时必填；PEM（PKCS#8 或 SEC1）SM2 私钥，必须与签名证书公钥匹配
        description: 国密 TLS 签名私钥文件路径

      - name: GM_TLS_ENC_CERT_FILE
        required: false
        default: ""
        note: GM_TLS_ENABLED=true 时必填；PEM 证书，公钥必须为 SM2；与签名证书一起构成 GM/T 0024 双证书
        description: 国密 TLS 加密证书文件路径

      - name: GM_TLS_ENC_KEY_FILE
        required: false
        default: ""
        note: GM_TLS_ENABLED=true 时必填；PEM（PKCS#8 或 SEC1）SM2 私钥，必须与加密证书公钥匹配
        description: 国密 TLS 加密私钥文件路径

      - name: GM_TLS_CA_FILE
        required: false
        default: ""
        note: GM_TLS_ENABLED=true 时必填；签名证书与加密证书都必须能链到该 PEM CA 包中的 SM2 受信根
        description: 国密 TLS 受信 CA 证书包路径

      - name: JWT_SIGNING_KEYS_FILE
        required: false
        default: ""
        note: 可选；未设置时：非 production 使用进程内临时密钥并输出 ephemeral signing keys 告警（重启与多副本不一致），production 拒绝启动，除非显式设置 ALLOW_EPHEMERAL_SIGNING_KEYS。文件为 JSON：keys[].kid/algorithm/private_key_pem/created_at/retired_at，可选 overlap（默认 48h，不得小于 2× applications.expire_in_hours 默认 24h）。kid 必须全局唯一且前缀匹配算法（RS256→rsa_、SM2-SM3→gm_）；私钥仅经部署注入，禁止写入仓库、日志或镜像
        description: JWT 签名密钥环文件路径（多 kid 持久化与退役重叠窗口）

      - name: ALLOW_EPHEMERAL_SIGNING_KEYS
        required: false
        default: "false"
        values: ["true", "false"]
        note: 仅供 production 在未配置 JWT_SIGNING_KEYS_FILE 时显式放行进程内临时签名密钥；true/1/yes/on 视为开启，其它取值视为关闭。开启后启动 WARN：多副本不共享签名密钥、重启换 kid；仅限单副本或一次性环境，不得作为常规生产配置
        description: 显式允许生产环境使用临时 JWT 签名密钥的逃生开关

      - name: KMS_PROVIDER
        required: false
        default: none
        values: [none, vault]
        note: 未知取值回退 EnvKeyProvider 并告警——生产必须显式使用 vault 或受管 KMS，不得静默降级（ADR-009 / ADR-015）
        description: 密钥管理提供方选择

      - name: VAULT_ADDR
        required: false
        note: KMS_PROVIDER=vault 时必填；缺失即初始化失败（fail-close）
        description: Vault 服务地址

      - name: VAULT_TOKEN
        required: false
        note: KMS_PROVIDER=vault 时必填；仅经环境注入，禁止落库/日志/前端（ADR-009）
        description: Vault 访问令牌

      - name: VAULT_KEYS_PATH
        required: false
        default: secrets/data/guliangiam/production/keys
        note: 密钥路径前缀；未显式配置时使用代码默认值
        description: Vault 密钥存储路径前缀

  D2_legacy_db:
    title: 数据库与连接池（旧版兼容别名）
    vars:
      - name: POSTGRES_DSN
        required: false
        note: DB_DSN 的兼容别名；优先级 DB_DSN > POSTGRES_DSN > DATABASE_URL，仅在高优先级键未设置时生效。非生产环境 .env 会补入该键，从而压过编排层注入的 DATABASE_URL（OPEN-API-45）
        description: PostgreSQL 连接串

      - name: DATABASE_URL
        required: false
        note: DB_DSN 的兼容别名；优先级最低（DB_DSN > POSTGRES_DSN > DATABASE_URL），仅在前两者未设置时生效
        description: 备选连接串

      - name: POSTGRES_MAX_CONNS
        required: false
        note: 兼容别名，ADR-023
        description: 连接池最大连接数

      - name: POSTGRES_MIN_CONNS
        required: false
        note: 兼容别名，ADR-023
        description: 连接池最小连接数

      - name: AUTO_MIGRATE
        required: false
        default: "false"
        note: 默认关闭；服务启动可用 -migrate 显式开启（命令行优先），或显式 true/1/yes/on；生产必须 false，迁移由运维显式执行
        description: 是否启动时自动执行迁移

      - name: AUTO_SEED
        required: false
        default: "false"
        note: 默认关闭；服务启动可用 -seed 显式开启（隐含 -migrate），或显式 true/1/yes/on；生产必须 false
        description: 是否自动执行 Seed

      - name: BOOTSTRAP_ADMIN_PASSWORD
        required: false
        note: 仅首次播种、旧默认凭据被撤销后或需替换开发哨兵时必需；不得设置默认值或写入真实口令；12-128 字符且含大小写字母、数字、特殊字符；会替换数据链哨兵，但不覆盖用户自定义的非空哈希；新凭据强制首登改密
        description: 内置管理员一次性初始化口令

      - name: BOOTSTRAP_INTEGRITY_STRICT
        required: false
        default: "true"
        note: 默认严格；账本/种子/管理员凭据基线未自证通过时拒绝启动（SEC-BOOT-INTEGRITY）；仅非生产可显式 false/0 跳过；APP_ENV=production 且显式 false 视为配置错误 fail-fast；不可解析取值直接报错
        description: 启动完整性校验严格模式开关

      - name: POSTGRES_TEST_DSN
        required: false
        note: 仅单元测试使用；不参与运行时配置
        description: PostgreSQL 测试连接串

      - name: GIAM_TEST_PG_DSN
        required: false
        test_only: true
        note: 仅真实 PostgreSQL 集成测试使用（GM R2 审计链用例）；不参与运行时配置
        description: SM3 审计链集成测试连接串

      - name: AUDIT_VERIFY_TEST_DSN
        required: false
        test_only: true
        note: 仅 cmd/audit-verify 集成测试使用；不参与运行时配置
        description: audit-verify 链校验集成测试连接串

  D3_db_driver:
    title: 多数据库方言与驱动（ADR-023）
    vars:
      - name: DB_DRIVER
        required: false
        default: postgres
        values: [postgres, mysql, dm, kingbase, gaussdb, oceanbase, oscar]
        note: 未知值必须启动失败，不得静默回退默认
        description: 方言选择

      - name: DB_DSN
        required: true
        note: 与 POSTGRES_DSN / DATABASE_URL 三选一；优先级 DB_DSN > POSTGRES_DSN > DATABASE_URL（DB_DSN 最高）。服务启动日志 `postgres DSN source` 只打印生效来源键名，不打印值
        description: 统一连接串

      - name: DB_MAX_OPEN_CONNS
        required: false
        description: 连接池最大连接数

      - name: DB_MAX_IDLE_CONNS
        required: false
        description: 连接池最大空闲连接数

      - name: DB_CONN_MAX_LIFETIME
        required: false
        default: "30m"
        description: 单连接最长存活时长（Go duration 字面量）

      - name: MYSQL_DSN
        required: false
        note: MySQL 方言连接串（DB_DRIVER=mysql 时读取）
        description: MySQL 连接串

      - name: MYSQL_URL
        required: false
        note: MYSQL_DSN 的 URL 别名
        description: MySQL URL 格式连接串

      - name: MYSQL_MAX_OPEN_CONNS
        required: false
        description: MySQL 连接池最大打开连接数

      - name: MYSQL_MAX_IDLE_CONNS
        required: false
        description: MySQL 连接池最大空闲连接数

  D4_http_rate_limit:
    title: HTTP、服务标识、限流与可观测性
    vars:
      - name: HTTP_ADDR
        required: false
        default: ":8000"
        note: 优先于 HTTP_PORT
        description: HTTP 监听地址

      - name: HTTP_PORT
        required: false
        default: "8000"
        note: 未设置 HTTP_ADDR 时生效
        description: HTTP 端口

      - name: ISSUER_URL
        required: true
        description: JWT issuer 公网 URL

      - name: CORS_ALLOWED_ORIGINS
        required: false
        default: ""
        note: 空=同源不放行；逗号分隔；支持 https://*.父域 通配
        description: 浏览器跨域允许来源白名单

      - name: CORS_ALLOWED_METHODS
        required: false
        default: "GET,POST,PATCH,PUT,DELETE,OPTIONS"
        description: 预检允许方法白名单

      - name: CORS_MAX_AGE
        required: false
        default: "86400"
        note: 0 或非法值回落 86400（Chrome / Firefox 预检缓存上限）
        description: 预检结果缓存秒数

      - name: AUTH_PASSWORD_CHANGE_ENFORCEMENT
        required: false
        default: "enforce"
        note: off|warn|enforce；未设置=默认 enforce；非法值回落 enforce 并记 warn 日志；密码状态按会话缓存 30s
        description: 强制改密门禁模式（warn 只计数与日志；enforce 在请求期拦截未改密会话，按密码状态分别返回 403：need_update_password→password_change_required，max_age_exceeded→password_expired；off 仅登录响应提示）

      - name: PASSWORD_BREACH_CHECK_ENABLED
        required: false
        default: "false"
        note: true/false/1/0；未设置=false（进程不出域）；拼错在启动校验失败；开启后注册/改密/重置在策略校验后走 HIBP k-匿名 range 查询（仅 SHA-1 前 5 位出域），依赖故障 fail-open 并在审计 payload 标记 breachCheck=unverified
        description: 泄露口令检查开关（AUTH-009 / OPEN-API-85）

      - name: PASSWORD_BREACH_CHECK_BASE_URL
        required: false
        default: "https://api.pwnedpasswords.com"
        note: 空=官方 range API；覆盖用于自建镜像或隔离测试环境；请求超时固定 2s，范围响应缓存 24h（复用 session-cache Redis，无 Redis 回退进程内）
        description: HIBP range API 基地址

      - name: REGION_RESIDENCY_MODE
        required: false
        default: "observe"
        note: off|observe|enforce；未设置/非法值=observe（只记结构化 warn，fail-open 便于灰度）；enforce 在跨租户 target 解析后比较双方 region，跨 region 或无绑定返回 403
        description: 跨 region 数据驻留守卫模式（observe 观察并记录 region_residency_violation；enforce 拒绝跨 region 租户访问）

      - name: TRUSTED_PROXY_CIDRS
        required: false
        default: ""
        note: 逗号分隔 CIDR；空=不信任任何代理（生产安全默认）；仅当 RemoteAddr 命中时才采信 X-Forwarded-For/X-Real-IP
        description: 反向代理可信 CIDR 列表（客户端 IP 解析）

      - name: MTLS_PROXY_CLIENT_CERT_HEADER
        required: false
        default: ""
        note: 空=忽略所有转发证书头（安全默认）；非空时必须同时配置 TRUSTED_PROXY_CIDRS，仅当直连 peer 命中该列表时读取；支持 XFCC `Cert="..."` 或裸 URL 编码 PEM；代理必须自行校验客户端证书并覆盖（不得追加）该头；配置了 TLS_CLIENT_CA_FILE 时应用层仍会校验转发来的证书链
        description: 反向代理传递客户端证书链的头名（RFC 8705 客户端认证）

      - name: TLS_CERT_FILE
        required: false
        default: ""
        note: 与 TLS_KEY_FILE 成对设置时进程内终止 TLS；集群部署通常由 Ingress 终止
        description: 服务端 TLS 证书文件路径

      - name: TLS_KEY_FILE
        required: false
        default: ""
        description: 服务端 TLS 私钥文件路径

      - name: TLS_CLIENT_CA_FILE
        required: false
        default: ""
        note: 进程内 TLS 始终请求客户端证书（RequestClientCert）；设置该 CA 包后，tls_client_auth 用该根校验客户端证书链，未设置时该方式 fail-closed；self_signed_tls_client_auth 仅按登记的指纹匹配；未启用进程内 TLS 时，仅在 MTLS_PROXY_CLIENT_CERT_HEADER 非空下允许单独设置，用于校验代理转发来的证书链
        description: 客户端证书 CA 包路径（RFC 8705 客户端认证）

      - name: RATE_LIMIT_RPM
        required: false
        deprecated: true
        note: 已废弃（ADR-021 第 4 条）；语义并入 RATE_LIMIT_GLOBAL_RATE
        description: 旧版 RPM

      - name: RATE_LIMIT_GLOBAL_RATE
        required: false
        default: "100"
        description: 全局速率（req/s）

      - name: RATE_LIMIT_GLOBAL_BURST
        required: false
        default: "200"
        description: 全局突发

      - name: RATE_LIMIT_AUTH_RATE
        required: false
        default: "10"
        note: req/min；读入时 /60.0 转 per-second
        description: 认证面速率

      - name: RATE_LIMIT_AUTH_BURST
        required: false
        default: "5"
        note: 不是 20——部署指南 compose 示例的 20 是覆盖值
        description: 认证面突发

      - name: RATE_LIMIT_AUDIT_DENIAL_RATE
        required: false
        default: "10"
        description: 拒绝审计独立令牌桶速率（events/s）；超限明细丢弃并告警，响应不受影响

      - name: RATE_LIMIT_SIGNUP_RATE
