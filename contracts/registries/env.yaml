        default: memory
        values: [memory, redis]
        note: redis 驱动不可用时回落 memory 并返回说明性错误，不 panic
        description: 会话缓存驱动

      - name: REDIS_ADDR
        required: false
        note: redis 驱动必填
        description: Redis 服务地址（host:port）

      - name: REDIS_PASSWORD
        required: false
        description: Redis 密码

      - name: REDIS_DB
        required: false
        default: "0"
        description: Redis 数据库编号

      - name: REDIS_POOL_SIZE
        required: false
        default: "0"
        note: 0 表示使用 go-redis 默认（10 × GOMAXPROCS）
        description: Redis 连接池大小

      - name: REDIS_MAX_RETRIES
        required: false
        default: "3"
        description: Redis 最大重试次数

      - name: REDIS_DIAL_TIMEOUT
        required: false
        default: 2s
        description: Redis 建连超时（Go duration 字面量）

      - name: REDIS_READ_TIMEOUT
        required: false
        default: 2s
        description: Redis 读超时（Go duration 字面量）

      - name: REDIS_WRITE_TIMEOUT
        required: false
        default: 2s
        description: Redis 写超时（Go duration 字面量）

      - name: RATE_LIMIT_REDIS_ADDR
        required: false
        note: 未设置时限流退化为进程内令牌桶（多实例可被绕过）
        description: 分布式限流专用 Redis 地址

      - name: RATE_LIMIT_REDIS_PASSWORD
        required: false
        description: 分布式限流专用 Redis 密码

      - name: RATE_LIMIT_REDIS_DB
        required: false
        default: "1"
        description: 分布式限流专用 Redis 数据库编号

  D12_circuit_observability_migration:
    title: 熔断、可观测与迁移校验
    vars:
      - name: CIRCUIT_FAILURE_THRESHOLD
        required: false
        default: "3"
        description: 熔断器连续失败阈值

      - name: CIRCUIT_RECOVERY_INTERVAL
        required: false
        default: 5s
        description: 熔断器恢复探测间隔（Go duration 字面量）

      - name: METRICS_SCRAPE_TOKEN
        required: production
        note: 生产必填（缺失时拒绝启动）；非生产未设置时 /metrics 无鉴权暴露并回 X-Warning
        description: Prometheus /metrics 抓取令牌

      - name: ALLOW_CHECKSUM_DRIFT
        required: false
        note: APP_ENV=development 时默认开启并重放变更后的幂等迁移；可显式设为 false 关闭；production 禁止
        description: 开发环境迁移校验和漂移重放开关

      - name: SCHEMA_CONTENT_HASH
        required: false
        note: 可选钉扎；设置后镜像内结构集哈希不一致即启动失败
        description: 期望的 schema 内容哈希

      - name: GULIANGIAM_SQL_GUARD_MODE
        required: false
        default: log
        values: [panic, log, off]
        description: SQL 注入运行时防御守卫模式（sqlguard 包）；panic 严格模式、log 默认观察期、off 跳过校验

discipline:
  - 禁止把后端密钥放进 VITE_*（会被打包进浏览器产物）
  - CURSOR_HMAC_KEY / ETAG_HMAC_KEY / SESSION_HMAC_KEY 内置默认值仅允许在非生产环境回落
  - ENCRYPTION_KEY_CURRENT 在所有环境必填，无默认值可回落
