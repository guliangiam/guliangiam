version: 2
# provider-kinds.yaml — identity family closed-set -> consuming subsystem.
#
# Semantics:
#   routable: true   — the kind has a consumer reference today (legacy/env path
#                      or an already-wired subsystem; `syslog` is consumed by the
#                      outbox audit observer).
#   routable: false  — the kind is declared but no consumer resolves it yet.
#                      It MUST name a batch; a kind becomes routable only when
#                      its consumer, config fields and failure semantics land in
#                      the same change.
#   managed_via     — the management endpoint that owns this kind when its
#                      runtime consumer is a dedicated subsystem table rather
#                      than the unified `providers` row. The unified /providers
#                      API rejects create, kind/providerType changes,
#                      activation, secret rotation and connection tests for
#                      these kinds (422 + meta.managedBy).
#   consumer_table  — the dedicated table the runtime actually reads for a
#                      managed_via kind.
#
# managed_via/consumer_table are omitted for kinds owned by the unified
# registry. internal/app/providers/delegated.go holds the code-side
# kind -> endpoint map, and this file mirrors it; scripts/check-provider-kinds.py
# compares the two (missing, extra or mismatched ownership fails the gate).
#
# This file is the single mapping source. scripts/check-provider-kinds.py
# compares it with identityKinds in internal/app/providers/kind.go and with the
# runtime pending map in internal/app/providers/kind_routes.go.
