claim_discipline:
- capability: 安全响应头
  claim_rule: S36 为'部分实现'——CSP 当前以 Content-Security-Policy-Report-Only 输出（强制模式会拦掉 SAML POST binding 的内联 onload 自动提交），只有在 CSP 以强制模式输出且 Permissions-Policy 与 Referrer-Policy 均已生效时才可声称'完整安全头基线'
- capability: WebAuthn
  claim_rule: S1~S3 全部'已实现'前，只能说'WebAuthn 注册/认证流程开发中'
- capability: DPoP
  claim_rule: S4、S5 全部'已实现'前，不得声称'DPoP 完整支持'
- capability: 多租户隔离
  claim_rule: S12 已实现 → 可声称'数据库级强制隔离（FORCE RLS + 非 owner 角色 + 事务级租户上下文注入）'
- capability: 审计
  claim_rule: S15 已实现 → 可声称'审计防篡改（SHA-256 哈希链 + chain_seq 锚定 + WORM 归档校验）'
- capability: SAML/CAS
  claim_rule: S6~S8 对应项'已实现'前，协议面端点表述为'开发中'
