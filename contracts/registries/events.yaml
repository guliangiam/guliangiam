# ──────────────────────────────────────────────────────────────────────────
# events.yaml — 领域/审计事件名注册表
#
# 唯一事实源：本文件（YAML）
# 渲染层：docs/generated/event-registry.md（人类可读视图）
# 消费方：scripts/check-registry-sync.py（结构校验）
#
# 登记口径：
#   1. 键 = 事件顶层命名空间（域）；值 = 该域下的事件名全表。
#   2. 事件名格式 {域}.{对象}[.{子对象}]_{过去式}；本表登记值为唯一事实源。
#   3. 新增事件必须先在本表登记，再在代码中引用；代码引用与登记值的双向比对
#      由门禁脚本承载（见 scripts/check-registry-sync.py 的 events 断言）。
# ──────────────────────────────────────────────────────────────────────────
