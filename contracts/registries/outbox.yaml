# ──────────────────────────────────────────────────────────────────────────
# outbox.yaml — Outbox / Worker / Webhook 投递参数机器可读注册表
#
# 唯一事实源：本文件（YAML）
# 渲染层：outbox-registry.md（人类可读视图）
# 消费方：
#   1. scripts/check-registry-sync.py — DDL 默认值 ↔ Worker 配置 ↔ AC 逐值一致
#   2. scripts/check-doc-anchors.py — 文档引用一致性
#
# 所有 Outbox 投递统一走 outbox.aggregate_type='webhook' 承载，不建独立表
# ──────────────────────────────────────────────────────────────────────────

version: 1

# ── Outbox Worker 参数 ────────────────────────────────────────────────────
worker:
  poll_interval: "500ms"
  poll_interval_env: OUTBOX_POLL_INTERVAL_MS
  poll_interval_desc: "Worker 扫描 status='pending' AND available_at<=now() 的周期"

  batch_size: 100
  batch_size_env: OUTBOX_BATCH_SIZE
  batch_size_desc: "单轮 FOR UPDATE SKIP LOCKED 领取行数"

  lease_seconds: 30
  lease_seconds_env: OUTBOX_LEASE_SECONDS
  lease_seconds_desc: "领取后 locked_by/locked_at 持有期"

  lease_reclaim_seconds: 60
  lease_reclaim_seconds_env: OUTBOX_LEASE_RECLAIM_SECONDS
  lease_reclaim_seconds_desc: "locked_at 超过租约时长 ×2 仍未终态的行，由回收扫描重置回 pending"

  max_attempts: 12
  max_attempts_env: OUTBOX_MAX_ATTEMPTS
  max_attempts_desc: "超过进入 dead；全仓统一，DDL 默认 / Worker / AC-WEBHOOK-001 均以此为准"

  backoff_strategy: "2^n 秒，上限 300s，±20% 抖动"
  backoff_formula: "available_at = now() + min(2^n, 300)s × (1±0.2)"
  backoff_desc: "抖动防同批事件同时重试；固定，不进环境变量"

  dead_letter_disposal: "迁入 outbox_dead_letters + records 审计 + 告警；原行保留供追溯"
  dead_letter_desc: "固定处置，不进环境变量"

  dedup_scope: "(aggregate_type, aggregate_id, event_type)"
  dedup_desc: "人工重放与消费侧幂等键；同聚合同类型事件只允许一个在途实例"

  dedup_ttl: "7d"
  dedup_ttl_env: OUTBOX_DEDUP_TTL_HOURS
  dedup_ttl_desc: "去重登记过期物理删除；与 idempotency_keys（24h）不同层不同 TTL"

# ── Webhook 投递参数 ──────────────────────────────────────────────────────
# 统一走 outbox.aggregate_type='webhook' 承载，不建独立表
webhook:
  signature_header: "GuliangIAM-Signature: t=<unix_sec>,v1=<hex_hmac_sha256(t + '.' + body)>"
  signature_v1_desc: "v1 为对 t + '.' + 原始请求体 的 HMAC-SHA256（密钥为解密后的 webhooks.secret）"

  replay_window: "±5min"
  replay_window_env: WEBHOOK_REPLAY_WINDOW_SECONDS
  replay_window_desc: "接收侧要求 |now - t| ≤ 300s 且 (t, v1) 首次出现，窗外拒绝"

  status_code_retry_policy:
    no_retry: "4xx（除 408/429）——语义性失败重试无意义"
    immediate_dead: "410 Gone——视为订阅方永久放弃"
    retry_with_backoff: "5xx / 429 / 网络超时——按 worker.backoff_strategy 重试"

  ordering: "按 (aggregate_type, aggregate_id) 分区内串行投递；声明不提供全局顺序"

  outbound_timeout: "10s"
  outbound_timeout_desc: "单次投递 HTTP 超时；webhooks.timeout_ms 列可覆盖"

# ── 去重层次表 ────────────────────────────────────────────────────────────
dedup_layers:
  - layer: 请求级
    key: "(scope, idempotency_key)"
    ttl: "24h"
    purpose: "防同一客户端重复提交（Idempotency-Key 头）"
    carrier: idempotency_keys 表

  - layer: 事件级
    key: "(aggregate_type, aggregate_id, event_type)"
    ttl: "7d"
    purpose: "防同一业务事件重复投递（人工重放 + Worker 重试）"
    carrier: "outbox 表的 event_id 去重登记"

  - layer: 消费级
    key: event_id
    ttl: 由消费者自定
    purpose: "消费方幂等"
    carrier: 消费方自建

note: "TTL 差异是设计选择：请求级覆盖客户端重试窗口（24h）；事件级覆盖人工重放窗口（7d）"

# ── SSRF 出口管控（所有出站 HTTP） ────────────────────────────────────────
ssrf_rules:
  - rule: 禁内网 IP 段
    detail: "RFC 1918 全部 + 127.0.0.0/8 + ::1 + 链路本地 169.254.0.0/16（云元数据面）"

  - rule: 禁止跟随重定向
    detail: "确需支持时限 1 跳且对目标重新执行全部校验"

  - rule: DNS rebinding 防护
    detail: "解析后固定 IP 连接，禁止 DNS 校验一次、连接再解析一次"

  - rule: URL scheme 白名单
    detail: "https（开发环境允许 http 并在启动日志标注）"

  - rule: 端口白名单
    detail: "443（同上放宽 80）"

  - rule: 适用范围
    detail: "Webhook / pgtUrl 回调 / LDAP / Syncer 出站连接 / SCIM 出站 Client"

# ────────────────────────────────────────────────────────────────────────────
# AI Gateway Outbox 事件（设计 §13 / §14.3）
# 由 app/aigateway/outbox_handlers.go 写入；Consumer 侧由 billing bridge
# (metering_events) + notifications（ai.quota.exceeded / circuit）处理
# ────────────────────────────────────────────────────────────────────────────
ai_events:
  - event: ai.usage.recorded
    severity: info
    aggregate_type: llm_usage_logs
    event_uid_rule: sha256(request_id + attempt_no)  # 幂等
    fields: [organization_id, api_key_id, alias_id, provider_id, model_id,
             input_tokens, output_tokens, total_tokens, cost_amount, currency,
             request_id, attempt_no]
    sinks:
    - type: metering
      metric: ai.tokens.input / ai.tokens.output / ai.requests / ai.cost
      table: metering_events
    - type: audit
      table: records
    note: 每次推理完成后同事务写入 outbox + llm_usage_logs

  - event: ai.quota.exceeded
    severity: high
    aggregate_type: llm_quota_policies
    fields: [organization_id, api_key_id, limit_type, current_usage, limit_value, request_id]
    sinks:
    - type: notification
      channel: email/webhook
      audience: org_admin
    note: RPM/TPM/预算 任一维度超限时写入；Consumer 触发通知

  - event: ai.provider.circuit_opened
    severity: high
    aggregate_type: llm_provider_health
    fields: [organization_id, provider_id, failure_count, open_reason]
    sinks:
    - type: notification
      channel: email/webhook
      audience: org_admin
    - type: state_update
      table: llm_provider_health.state → open
    note: 连续 failure_threshold 次失败触发；非自动恢复事件

  - event: ai.provider.circuit_closed
    severity: info
    aggregate_type: llm_provider_health
    fields: [organization_id, provider_id, recovery_type]  # half_open_probe_succeeded / manual_reset
    sinks:
    - type: state_update
      table: llm_provider_health.state → healthy
    note: half_open 探测成功 或 管理员手动重置触发；closed 不写 records（自动状态迁移）
