# 消费方：scripts/check-route-resource-derivation.py。
#   * 命中且 expires_on 未过期 → 计入 PASS，打印 `KNOWN-RED n/22` 摘要，不改变裁决；
#   * 命中但已过期 → 判红（KNOWN_RED_EXPIRED），到期即恢复阻断；
#   * 不在本列表内 → 立即判红（NESTED/R1/R2 原规则），检出能力不受基线影响；
#   * 未命中任何当前失配 → WARN（KNOWN_RED_STALE），提示清理。
#
# 定位：这 22 条是**声明债**，不是豁免。NESTED 类不允许写 route-resource-exemptions.yaml；
# 唯一缓冲是「带期限的 known-red」，到期自动再红。修复路线按 Y 批次「改声明」推进：
# 运行时按路径首段派生资源，因此绝大多数条目只改 Permission 字符串即可；
# 少数需要同步 Casbin policy slug 或运行时特判（见 CHANGELOG 2026-11-04 条目）。
