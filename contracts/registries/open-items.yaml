  - id: OPEN-API-93
    status: open
    surface: API
    severity: medium
    impact: "Captcha 必需性的裁决面不一致：设计 login.md 规定由 application.signin_items 的 Captcha 项控制，前端登录按应用 Captcha provider rule（getCaptchaRule，Never 不渲染挑战）、注册按组织 captcha-status.required 渲染；后端登录/注册却无条件调用组织级 EnforceCaptcha，组织存在启用提供商行即 fail-close。组织启用提供商而应用未绑定 Captcha signin item 时，前端不渲染挑战、后端拒绝提交，密码登录/注册被 400 captcha is required 阻断且无 UI 出路。"
    gap: "internal/app/auth/login_flow.go 与 password_reset_signup.go 的 EnforceCaptcha 调用不感知应用 signin_items/provider rule；docs/design/auth/login.md 的 signin_items 控制口径未在后端登录/注册链路落地；登录与注册前端裁决面也不一致（应用 rule vs 组织 captcha-status）。种子占位行已随 G7-f 禁用消除播种态阻断，但语义分歧仍在。"
    current_disposition: "G7-f（2026-11-23）登记：种子 built-in-captcha 占位行改为 is_enabled=false 并幂等修正现存库（重放/启动场景门禁通过），恢复播种态可登录；组织级 fail-close 与应用级 signin_items 的权威裁决面属认证契约设计裁决，不单方面改动，待用户裁定。"
    close_condition: "裁定 Captcha 必需性权威裁决面（应用 signin_items/provider rule 或组织级启用行）并统一登录/注册前后端实现与设计文档，附『组织启用提供商 + 应用未绑定 Captcha』组合的回归证据；或正式裁定接受双层语义并修订 login.md 口径。"
    code_reference: internal/app/auth/login_flow.go + internal/app/auth/password_reset_signup.go + docs/design/auth/login.md + web/src/shared/hooks/useCaptchaFlow.ts + web/src/pages/auth/useSignupPageController.ts
