    impact: "DCR 可注册出永远无法认证的 mTLS 客户端：allowedTokenEndpointAuthMethods 取领域闭集（含 tls_client_auth / self_signed_tls_client_auth），但 RFC 7591 请求没有客户端证书字段，注册与 update 都不会写 app_client_certificates，token endpoint 的 mTLS 分支因无证书行直接 401。控制台 create/PATCH 已要求证书，DCR 协议面未对齐。"
    gap: "internal/app/applications/dcr.go 仅对 private_key_jwt 校验内嵌 jwks；对两种 mTLS 方法既不拒绝也不登记证书；UpdateDynamicClient 切换到 mTLS 时同样不检查既有 active 证书。"
    current_disposition: "2026-11-07 人工裁决注销（实现已落地）：register/update 显式选择 mTLS 一律返回 400 invalid_client_metadata 并引导走控制台；update 省略 token_endpoint_auth_method、沿用当前 mTLS 方法时，要求存在 AuthMethod 匹配的 active 证书。DCR 路径不承载证书绑定是显式架构边界：mTLS 证书材料只经控制台登记，DCR 仅承载非证书元数据。同批补齐两处相邻缺口：register 选择 private_key_jwt 但未内嵌 jwks 时返回 400（update 原有检查）；update 切到 client_secret_basic/client_secret_post 时，若客户端既无可用 app_client_secrets 行也无 legacy hash，返回 400。传输层 RegisterClientRequest/UpdateClientRequest 解析 jwks 与 jwks_uri 并转发服务层；jwks_uri 按 invalid_client_metadata 显式拒绝——内嵌 JWKS 是唯一能保证“注册即可用”的形态，启用 jwks_uri 需 HTTPS、公网 host、拉取失败降级等前置校验，不在本批范围。OpenAPI UpdateOAuthClientRequest 同步声明 token_endpoint_auth_method 与 jwks。"
    close_condition: "①DCR register/update 对 mTLS 方法要么拒绝（400 invalid_client_metadata，并引导走控制台登记证书），要么定义并实现受控证书登记路径并在同一事务写入；②失败信息不泄露内部原因；③发现文档/OpenAPI/注册表同步；④单测覆盖 register 与 update 两条路径，含切换方法与已有证书场景。"
    code_reference: internal/app/applications/dcr.go + internal/app/applications/dcr_test.go + internal/app/applications/dcr_auth_test.go + internal/transport/http/api/v1/dcr/handler.go + internal/transport/http/api/v1/dcr/handler_decode_test.go
    closed: true

