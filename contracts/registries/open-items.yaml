  - id: OPEN-API-12
    status: closed
    surface: API
    gap: "声明式 Schema 无法区分「有界文本」与「无上界文本」的默认值契约：逻辑类型 TEXT 在 MySQL 侧映射为 TEXT/MEDIUMTEXT，而 MySQL 严格模式禁止 TEXT/BLOB/JSON 系列携带 DEFAULT，故声明式里带默认值的 500 个 TEXT 列在 MySQL 产物中只能去掉默认值（实测脚本：contracts/schema/*.yaml 全量列 × gen_schema.mysql_type_of）。此前该冲突被「把逻辑 TEXT 映射成 VARCHAR(100) 以换取默认值」掩盖——MySQL 产物曾出现 521 列 VARCHAR(100)，代价是 517 列无上界文本被静默收窄；现改为响亮地少一个默认值，缺口因此显式化"
    current_disposition: "两批收敛全部完成（2026-10-16）：A1 类 71 列非空短默认值（status/method/type/algorithm/currency）→ VARCHAR(64) + 保留 DEFAULT；A2 类 325 列空串默认 + 短列名（host/url/token/name/database/region_code/description/password/username）→ VARCHAR(255) + 保留 DEFAULT；B 类 22 列真实长文本（custom_css/template/model_text/custom_body）已不在活动 schema，history 残留不动。check-schema-defaults.py 存量 396 → 0（基线清空）。Schema diff 精确为 10 文件 × 343 insert/343 delete（每列一行 type 替换）。MySQL 产物 +325 处 DEFAULT（之前全部被 gen_schema.py 静默丢弃）——同一份声明式 Schema 在 PostgreSQL 与 MySQL 两方言上的 DDL 契约正式对齐。门禁永久强制：新增 TEXT/LONGTEXT 带 DEFAULT 的列 → check-schema-defaults.py 立即 FAIL。"
    close_condition: "contracts/schema/*.yaml 引入显式的有界/无上界类型契约（如 VARCHAR(n) 表达有界且可带默认、TEXT/LONGTEXT 表达无上界且禁止默认），并由 check-schema-parity.py 类型断言与新增默认值断言共同强制"
