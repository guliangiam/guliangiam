    current_disposition: "四轮实施全部落地。Phase 1 — DB migration V4 增 sessions.authentication_level VARCHAR(20) DEFAULT 'password'，domain.Session + PG/MySQL 双库 sessionRow/mapper/sql/Create 同步，缺省兜底 'password'。Phase 2 — login_flow 根据 verification.Completed 设 authLevel（password / mfa），Face ID + WebAuthn 硬编码 fido2，其他 5 条登录路径保持 repository 缺省 'password'。Phase 4 — 管理员豁免淘汰：enforceConcurrentSessionLimitWithTx / enforceSessionLimit 加 userIsAdmin + currentAuthLevel 参数，revoke_oldest 分支跳过 user.IsAdmin && authLevelRank(level)>=2 的会话，require_mfa 分支 authLevel>=mfa 直接放行，跳过/放行数量写 WARN 审计日志。authLevelRank 用数值比较（password=1,mfa=2,fido2=3）避免 Go 字典序陷阱（'password' >= 'mfa'=TRUE 会错误豁免所有 admin 会话）。Phase 3（两阶段 require_mfa 拆分）— preCheckRequireMFA 在 session 创建前做只读检查（不锁用户行）：超限 + require_mfa + authLevel<mfa + 用户有 MFA 方法 → 创建 challenge + 返回 toMfaRequiredLoginResponse（复用既有 MFA 响应结构）；authLevel 已够（mfa/fido2）→ 跳过；用户无 MFA 方法 + require_mfa → fail-closed。login_flow.go 在 MFA 完成后、session 创建前调 pre-check，触发时返回 MFA challenge 让用户补验证。非密码路径（Kerberos/LDAP/social/qrcode）无法发 MFA challenge，在 post-session enforce 里 require_mfa 分支 authLevel<password → fail-closed，安全兜底。用例覆盖全 4 轮改造后的 auth 包。"
