  - id: OPEN-API-34
    status: closed
    surface: API
    gap: "种子链 V1 的角色策略 INSERT 以 ON CONFLICT (enforcer_id, ptype, v0, v1, v2, v3, v4, v5) DO NOTHING 作仲裁键，但这些行的主键是固定 UUID；行已存在时实际冲突发生在 casbin_rules_pkey，仲裁键覆盖不到，重放必然报 duplicate key。后果集中在显式数据链重放：`go run ./cmd/migrate up --seed`、开发环境显式开 AUTO_SEED、或对同一库二次初始化都会失败（服务启动不再受影响——两个开关已改为默认关闭）。scripts/check-migrations.sh 的幂等规则只看语句里有没有 ON CONFLICT，看不到仲裁键与主键的关系，因此长期漏判。"
    current_disposition: "已闭环（2026-10-28）。根因：PostgreSQL 的 ON CONFLICT (arbiter) 只在指定的那个唯一约束上检查冲突。当主键冲突但仲裁键约束上没有冲突（如数据被损坏导致 id 与内容不匹配），ON CONFLICT 看不到冲突，主键冲突直接报 duplicate key。修复分三步：① V1 种子全部固定 UUID 主键的 INSERT 改用 ON CONFLICT DO NOTHING（不带仲裁键，覆盖所有唯一约束含主键）；② 新增 V6 种子作为额外保障（同样用不带仲裁键的 ON CONFLICT DO NOTHING 重放 casbin_rules 4 组策略行）；③ check-migrations.sh 新增仲裁键安全校验——固定 UUID 主键的 INSERT 要么用 ON CONFLICT DO NOTHING，要么仲裁键必须包含主键列 id（Python 脚本按 INSERT 语句分割而非分号，避免注释后空行合并多条语句导致的误判）。实测连续两次 `go run ./cmd/migrate up --seed` 退出码 0。"
    close_condition: "已满足：① V1 种子全部固定 UUID 主键 INSERT 改用 ON CONFLICT DO NOTHING；② 新增 V6 数据版本用无仲裁键 ON CONFLICT DO NOTHING 重放 casbin_rules；③ check-migrations.sh 对固定 UUID 主键 INSERT 强制校验仲裁键安全；④ 真实 PostgreSQL 上连续两次 migrate up --seed 退出码 0。"
    code_reference: scripts/check-migrations.sh
    closed: true

