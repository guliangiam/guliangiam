  - id: OPEN-API-94
    status: open
    surface: API
    severity: medium
    impact: "高风险跨租户写操作的审批票（operation_ticket）只有判定与存储层，无产品内申请/审批通路：ScopeAuthorizer Gate-8 对跨租户 RiskHigh 写（如平台管理员删除其他组织的应用）无已批准票即 403『cross-tenant high operation requires an approved ticket』，而 cross_tenant_operations 表与仓储虽就绪，却无 app 用例、HTTP 路由与控制台界面创建/审批/消费票据——设计 permissions.md 场景 4 的 NeedApproval 分支在产品内不可达，被拒操作无任何 UI 出路（隔离栈 stage2 实测：同租户删除通过、跨租户删除 403 属设计内安全行为，但审批闭环缺失）。"
    gap: "internal/infra/postgres/cross_tenant_operations/（repository.go/sql.go，含 ListByScope 查询）与 contracts/schema/60_audit.yaml 表定义、state-machines.yaml 状态闭集 pending/approved/rejected/used/expired 均已就绪；internal/app 无对应服务、internal/transport/http/api/v1 无路由、web/src 无 API/页面；permissions.md §7 票据审批链（approved_by/approved_at/expires_at/used_at）与场景 4 NeedApproval 流程未落地。新增路由与权限点属契约登记红线，须逐次请示。"
