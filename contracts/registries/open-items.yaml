    close_condition: "裁定并落地操作票端到端 surface（创建/审批/拒绝/消费/过期用例 + 路由与权限点注册表同步 + 控制台申请与审批界面 + NeedApproval 拒绝响应携带可操作指引）附『跨租户高风险写：申请→批准→执行→used』回归证据；或正式裁定接受运维侧票据注入（db/运维通道）并修订 permissions.md 场景 4 的产品内可达性口径。"
