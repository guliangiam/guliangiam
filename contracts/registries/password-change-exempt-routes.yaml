version: 1
# 强制改密门禁的豁免路由登记表。
# 中间件只查生成物 PasswordChangeExempt，不在代码里写路径字符串。
# path 使用路由声明中的 OpenAPI 风格（{param} 表示单段通配）。
# OPTIONS 由中间件无条件放行；这里的 OPTIONS * 是说明性记录，保证注册表本身可读。
routes:
  - method: POST
    path: /api/v1/auth/login
    reason: 登录本身（逾期账密的登录响应需返回提示态）
  - method: POST
    path: /api/v1/auth/logout
    reason: 登出必须随时可用
  - method: POST
    path: /api/v1/auth/password/change
    reason: 改密入口（自助改密后会话轮换即时生效）
  - method: GET
    path: /api/v1/auth/account
    reason: 账户页依赖账号上下文
  - method: GET
    path: /api/v1/auth/captcha-status
    reason: 登录前能力探测
  - method: GET
    path: /api/v1/auth/permissions
    reason: 前端权限引导判定
  - method: GET
    path: /api/v1/auth/login-challenges/{challengeId}
    reason: MFA 只读挑战查询
  - method: OPTIONS
    path: "*"
    reason: CORS 预检由中间件无条件放行，本条为说明性记录
  - method: GET
    path: /healthz
    reason: 运维存活探针（不在 protected 链，登记以保证清单完整）
  - method: GET
    path: /metrics
    reason: 运维指标端点（不在 protected 链，登记以保证清单完整）
